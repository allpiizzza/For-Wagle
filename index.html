<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Wagle</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            background-image:
                radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.18) 0, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(16, 185, 129, 0.15) 0, transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(251, 146, 60, 0.12) 0, transparent 35%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* 헤더 배너 */
        .hero {
            position: relative;
            padding: 28px 25px 30px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 55%, #60a5fa 100%);
            color: #ffffff;
            overflow: hidden;
        }
        .hero::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 22px;
            background: #ffffff;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .hero-wave {
            font-size: 2.2rem;
            display: inline-block;
            animation: bob 2.4s ease-in-out infinite;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-4px) rotate(-6deg); }
        }
        .hero h1 {
            margin: 6px 0 4px;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .hero p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
        }
        .bubble.b1 { width: 120px; height: 120px; top: -40px; right: -30px; }
        .bubble.b2 { width: 60px; height: 60px; top: 50px; right: 70px; }
        .bubble.b3 { width: 24px; height: 24px; top: 24px; right: 150px; }

        /* 버튼 목록 */
        .list {
            padding: 8px 25px 20px;
        }
        .section-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.04em;
            margin: 18px 2px 10px;
        }
        .section-label:first-child {
            margin-top: 4px;
        }
        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            text-decoration: none;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s, background-color 0.15s;
            animation: rise 0.45s ease backwards;
        }
        .link-btn:nth-of-type(2) { animation-delay: 0.07s; }
        .link-btn:nth-of-type(3) { animation-delay: 0.14s; }
        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .link-btn:hover,
        .link-btn:focus-visible {
            outline: none;
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            transform: translateY(-1px);
        }
        .link-btn:active {
            transform: scale(0.98);
        }

        /* 버튼별 아이콘 타일 */
        .icon {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: var(--tint, #e2e8f0);
        }
        .tint-blue   { --tint: #dbeafe; }
        .tint-violet { --tint: #ede9fe; }
        .tint-amber  { --tint: #fef3c7; }
        .tint-green  { --tint: #dcfce7; }
        .tint-rose   { --tint: #ffe4e6; }
        .tint-teal   { --tint: #ccfbf1; }

        .text {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .title {
            font-weight: 700;
            font-size: 0.98rem;
            color: #1e293b;
            line-height: 1.3;
        }
        .desc {
            font-size: 0.76rem;
            font-weight: 400;
            color: #94a3b8;
            line-height: 1.3;
        }
        .arrow {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .link-btn:hover .title,
        .link-btn:hover .arrow {
            color: #1d4ed8;
        }
        .link-btn:hover .desc {
            color: #60a5fa;
        }

        /* 마감 D-day 뱃지 */
        .dday {
            position: absolute;
            top: -8px;
            right: 12px;
            background: #ef4444;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 999px;
            box-shadow: 0 3px 8px rgba(239, 68, 68, 0.35);
            animation: pulse 1.8s ease-in-out infinite;
        }
        .dday:empty {
            display: none;
        }
        .dday.closed {
            background: #94a3b8;
            box-shadow: none;
            animation: none;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        footer {
            text-align: center;
            font-size: 0.78rem;
            color: #94a3b8;
            padding: 0 25px 22px;
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-wave, .dday, .link-btn {
                animation: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="hero">
        <span class="bubble b1"></span>
        <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <span class="hero-wave">🌊</span>
        <h1>For Wagle</h1>
        <p>와글와글 독서모임 바로가기 모음</p>
    </header>

    <main class="list">
        <div class="section-label">📢 와글 소식</div>

        <a class="link-btn" href="https://inside-wagle.vercel.app/chulcheck.html">
            <span class="icon tint-green">✅</span>
            <span class="text">
                <span class="title">출석체크</span>
                <span class="desc">오늘도 와글 출석 완료!</span>
            </span>
            <span class="arrow">›</span>
        </a>

        <a class="link-btn" href="https://inside-wagle.vercel.app/index.html">
            <span class="icon tint-blue">🕹️</span>
            <span class="text">
                <span class="title">인사이드 와글</span>
                <span class="desc">2027년 와글의 빅 이벤트</span>
            </span>
            <span class="arrow">›</span>
        </a>

        <a class="link-btn" href="https://forms.gle/TJw9gBihsqk4HVjC7">
            <span class="dday" id="proposalDday" data-deadline="2026-10-20"></span>
            <span class="icon tint-violet">📝</span>
            <span class="text">
                <span class="title">27년 프로그램 제안서</span>
                <span class="desc">10/20까지 꼭 하세요!!!</span>
            </span>
            <span class="arrow">›</span>
        </a>

        <a class="link-btn" href="https://inside-wagle.vercel.app/map/waglemap.html">
            <span class="icon tint-teal">🗺️</span>
            <span class="text">
                <span class="title">와글와글 지도</span>
                <span class="desc">와글들은 어디에 있을까?</span>
            </span>
            <span class="arrow">›</span>
        </a>

        <a class="link-btn" href="https://waggle-bookq-search.streamlit.app/">
            <span class="icon tint-amber">🔍</span>
            <span class="text">
                <span class="title">북큐 검색</span>
                <span class="desc">천재 채지피티 감사합니다 ❤️</span>
            </span>
            <span class="arrow">›</span>
        </a>

        <a class="link-btn" href="baechune.html">
            <span class="icon tint-green">🥬</span>
            <span class="text">
                <span class="title">배추네 아지트 공지</span>
                <span class="desc">독서모임 안내사항</span>
            </span>
            <span class="arrow">›</span>
        </a>

        <div class="section-label">🧰 생활 꿀팁</div>

        <a class="link-btn" href="https://www.okbari.net/">
            <span class="icon tint-teal">📱</span>
            <span class="text">
                <span class="title">전자책 검색</span>
                <span class="desc">읽고 싶은 전자책 찾기</span>
            </span>
            <span class="arrow">›</span>
        </a>

        <a class="link-btn" href="multagi.html">
            <span class="icon tint-rose">📉</span>
            <span class="text">
                <span class="title">주식 물타기 계산기</span>
                <span class="desc">추가 매수 후 평균단가 계산</span>
            </span>
            <span class="arrow">›</span>
        </a>
    </main>

    <footer>오늘도 와글와글 📚</footer>
</div>

<script>
    // 제안서 마감 D-day 표시
    (function () {
        const badge = document.getElementById('proposalDday');
        const [y, m, d] = badge.dataset.deadline.split('-').map(Number);
        const end = new Date(y, m - 1, d);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const days = Math.round((end - today) / 86400000);

        if (days > 0) {
            badge.textContent = 'D-' + days;
        } else if (days === 0) {
            badge.textContent = 'D-DAY';
        } else {
            badge.textContent = '마감';
            badge.classList.add('closed');
        }
    })();
</script>

</body>
</html>
