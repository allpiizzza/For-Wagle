<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #FFF6D9 0%, #FFE599 100%);
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #5D4037;
        }

        /* 관리자 모드가 활성화되면 비밀댓글(secret)은 숨기고, 실제내용(real)을 보여줍니다 */
        body.admin-mode .comment-secret { display: none; }
        body.admin-mode .comment-real { display: inline; }
        .comment-real { display: none; }
        .comment-secret { color: #BCAAA4; font-style: italic; font-size: 10px; }

        .board-frame {
            background: #FFFFFF;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 22px 20px;
            box-shadow: 0 10px 25px rgba(100, 60, 20, 0.08);
            border: 2px solid #FFF1C5;
            margin-top: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1.5px dashed #F3D295;
            padding-bottom: 12px;
        }

        .header h2 {
            margin: 0;
            font-size: 15px;
            color: #D32F2F;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 200;
        }

        button {
            background: linear-gradient(135deg, #FF7B54, #FFB26B);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 123, 84, 0.3);
        }

        .write-section { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .write-inputs { display: flex; gap: 8px; }

        .write-section input, .comment-write input, .auth-section input {
            border: 1.5px solid #F3D295;
            border-radius: 8px;
            outline: none;
            background: #FFFBF0;
            color: #5D4037;
            font-size: 11px;
            padding: 8px 10px;
        }

        .write-section input:focus, .comment-write input:focus, .auth-section input:focus {
            border-color: #FF7B54;
        }

        .write-section .main-input { flex: 1; }
        .write-section button { padding: 10px 16px; font-size: 11px; }

        .feed-list { list-style: none; padding: 0; margin: 0; }

        .post-item {
            background: linear-gradient(to bottom right, #FFFFFF, #FFFDF8);
            border: 1px solid #F3E5CB;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .post-content {
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
        }

        .post-author {
            font-size: 11px;
            color: #FF7B54;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .date-text { font-size: 10px; color: #A68A61; min-width: 60px; text-align: right; font-weight: 400; }

        .comment-list {
            list-style: none;
            padding: 10px;
            margin: 0 0 10px 0;
            background: #FFF9E6;
            border-radius: 8px;
        }

        .comment-item {
            font-size: 11px;
            color: #6D4C41;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #F0D59D;
            padding-bottom: 5px;
            line-height: 1.4;
        }

        .comment-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .reply-icon { color: #FF7B54; margin-right: 4px; font-weight: 700; }

        .comment-write { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .comment-write .comment-inputs { display: flex; gap: 6px; }
        .comment-write input { flex: 1; }
        .comment-write button {
            padding: 8px 12px;
            font-size: 11px;
            background: linear-gradient(135deg, #8D6E63, #A1887F);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #D32F2F;
            font-size: 10px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0.7;
        }

        .btn-delete:hover {
            opacity: 1;
            background: #FFEBEE;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 480px) {
            body { padding: 8px; }
            .board-frame { padding: 18px 14px; border-radius: 16px; }
            .write-section button { width: 100%; }
            .write-inputs, .comment-inputs { flex-direction: column; }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="board-frame">
    <div class="header">
        <h2>💡🤫📝</h2>

        <!-- 👇 관리자 로그인 영역 -->
        <div class="auth-section" style="display: flex; gap: 4px;">
            <input type="password" id="adminPw" placeholder="관리자 PW" style="width: 80px;">
            <button onclick="checkAdmin()" style="background: #A1887F;">보기</button>
        </div>
    </div>

    <!-- 👇 게시글 작성 영역 (닉네임/비밀번호 추가) -->
    <div class="write-section" id="writeSection">
        <div class="write-inputs">
            <input type="text" id="postNickname" placeholder="닉네임 (최대 10자)" maxlength="10" style="width: 100px; flex: none;">
            <input type="password" id="postPassword" placeholder="비밀번호" style="width: 100px; flex: none;">
        </div>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="postInput" class="main-input" aria-label="게시글 입력" placeholder="무슨 일이 일어나고 있나요?" maxlength="1000">
            <button onclick="createPost()">남기기</button>
        </div>
    </div>

    <ul class="feed-list" id="feedList">
        <li style="text-align:center; padding: 30px 10px; color:#A68A61; font-size: 11px;">대기 중...🐾</li>
    </ul>

    <div id="moreBtnSection" style="display: none; text-align: center; margin-top: 15px;">
        <button id="moreBtn" onclick="loadMorePosts()" style="background: linear-gradient(135deg, #8D6E63, #A1887F); width: 100%; padding: 10px;">더보기 🐾</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://skpmxrgewpdmlvckzekh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1dV_gRdjg3NTWyBiD56t_A_BH-HESQ6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPage = 1;
    const PAGE_SIZE = 10;
    let isLastPage = false;

    // 관리자 비밀번호 설정 (원하는 비밀번호로 변경하세요)
    const ADMIN_PASSWORD = '4321';

    window.onload = async () => {
        currentPage = 1;
        isLastPage = false;
        await fetchPosts(true);
    };

    // 📌 관리자 모드 확인 함수
    function checkAdmin() {
        const inputPw = document.getElementById('adminPw').value;
        if (inputPw === ADMIN_PASSWORD) {
            document.body.classList.add('admin-mode');
            alert("🔓 관리자 모드: 비밀 댓글 내용이 표시됩니다.");
        } else {
            alert("❌ 비밀번호가 틀렸습니다.");
        }
    }

    async function fetchPosts(isInitial = false) {
        if (isInitial) {
            currentPage = 1;
            isLastPage = false;
            document.getElementById('feedList').innerHTML = '';
        }

        const from = (currentPage - 1) * PAGE_SIZE;
        const to = currentPage * PAGE_SIZE - 1;

        // 작성자 닉네임 정보도 가져오도록 select 문 수정
        const { data: posts, error } = await supabaseClient
            .from('posts')
            .select('id, content, nickname, created_at, comments(id, content, nickname, created_at)')
            .order('last_activity_at', { ascending: false })
            .order('created_at', { foreignTable: 'comments', ascending: true })
            .range(from, to);

        if (error) return console.error('글 불러오기 실패:', error);

        if (!posts || posts.length < PAGE_SIZE) {
            isLastPage = true;
        }

        renderFeed(posts, isInitial);
    }

    async function loadMorePosts() {
        if (isLastPage) return;
        currentPage++;
        await fetchPosts(false);
    }

    // 📌 게시글 작성 (닉네임/비번 포함)
    async function createPost() {
        const nickname = document.getElementById('postNickname').value.trim() || '익명';
        const password = document.getElementById('postPassword').value.trim();
        const content = document.getElementById('postInput').value.trim();

        if (!content) return alert("내용을 입력하세요.");
        if (!password) return alert("게시글 삭제를 위한 비밀번호를 입력해주세요.");

        const { error } = await supabaseClient.from('posts').insert([{
            nickname: nickname,
            password: password,
            content: content
        }]);

        if (error) {
            alert("글 작성 실패!");
            console.error(error);
        } else {
            document.getElementById('postInput').value = '';
            document.getElementById('postPassword').value = '';
            await fetchPosts(true);
        }
    }

    // 📌 댓글 작성 (닉네임/비번 포함)
    async function createComment(postId) {
        const nickname = document.getElementById(`commentNick-${postId}`).value.trim() || '익명';
        const password = document.getElementById(`commentPw-${postId}`).value.trim();
        const content = document.getElementById(`commentInput-${postId}`).value.trim();

        if (!content) return alert("내용을 입력하세요.");
        if (!password) return alert("댓글 삭제를 위한 비밀번호를 입력해주세요.");

        const { error } = await supabaseClient.from('comments').insert([{
            post_id: postId,
            nickname: nickname,
            password: password,
            content: content
        }]);

        if (error) {
            alert("❌ DB 에러 발생!");
            console.error(error);
        } else {
            document.getElementById(`commentInput-${postId}`).value = '';
            document.getElementById(`commentPw-${postId}`).value = '';
            await fetchPosts(true);
        }
    }

    // 📌 게시글 삭제 (비밀번호 확인 방식)
    async function deletePost(postId) {
        const inputPw = prompt("게시글을 삭제하려면 비밀번호를 입력하세요:");
        if (!inputPw) return;

        // 1. 해당 글의 비밀번호가 맞는지 DB에서 조회
        const { data, error: fetchError } = await supabaseClient
            .from('posts')
            .select('password')
            .eq('id', postId)
            .single();

        if (fetchError || !data) return alert("❌ 게시글 정보를 찾을 수 없습니다.");
        if (data.password !== inputPw) return alert("🔒 비밀번호가 일치하지 않습니다.");

        // 2. 비밀번호가 맞으면 삭제 진행
        const { error } = await supabaseClient.from('posts').delete().eq('id', postId);

        if (error) {
            alert("❌ 오류가 발생했습니다: " + error.message);
        } else {
            alert("🗑️ 게시글이 삭제되었습니다.");
            await fetchPosts(true);
        }
    }

    // 📌 댓글 삭제 (비밀번호 확인 방식)
    async function deleteComment(commentId) {
        const inputPw = prompt("댓글을 삭제하려면 비밀번호를 입력하세요:");
        if (!inputPw) return;

        const { data, error: fetchError } = await supabaseClient
            .from('comments')
            .select('password')
            .eq('id', commentId)
            .single();

        if (fetchError || !data) return alert("❌ 댓글 정보를 찾을 수 없습니다.");
        if (data.password !== inputPw) return alert("🔒 비밀번호가 일치하지 않습니다.");

        const { error } = await supabaseClient.from('comments').delete().eq('id', commentId);

        if (error) {
            alert("❌ 오류가 발생했습니다: " + error.message);
        } else {
            alert("🗑️ 댓글이 삭제되었습니다.");
            await fetchPosts(true);
        }
    }

    function renderFeed(posts, isInitial) {
        const feedList = document.getElementById('feedList');
        const moreBtnSection = document.getElementById('moreBtnSection');

        if (isInitial && (!posts || posts.length === 0)) {
            feedList.innerHTML = '<li style="text-align:center; padding: 20px; color:#A68A61; font-size: 11px;">아직 등록된 글이 없어요. 첫 글을 남겨보세요!</li>';
            if (moreBtnSection) moreBtnSection.style.display = 'none';
            return;
        }

        let html = '';
        posts.forEach(post => {
            const postDate = new Date(post.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            let commentsHtml = '';

            if (post.comments && post.comments.length > 0) {
                post.comments.forEach(comment => {
                    const commentDate = new Date(comment.created_at).toLocaleString('ko-KR', { hour: '2-digit', minute: '2-digit' });

                    // 👇 댓글 구조: 비밀 댓글 안내 텍스트와 실제 텍스트 분리
                    commentsHtml += `
              <li class="comment-item">
                <div style="flex:1;">
                  <span class="reply-icon">💬</span>
                  <strong style="color:#FF7B54; margin-right: 4px;">${comment.nickname || '익명'}</strong>
                  <span class="comment-secret">비밀 댓글이 작성되었습니다. 🔒</span>
                  <span class="comment-real">${comment.content}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 4px;">
                  <span class="date-text">${commentDate}</span>
                  <button type="button" class="btn-delete btn-comment-delete" data-comment-id="${comment.id}">삭제</button>
                </div>
              </li>
            `;
                });
            }

            html += `
          <li class="post-item">
            <div class="post-content">
              <div style="display:flex; flex-direction: column; flex:1;">
                <div class="post-author">${post.nickname || '익명'}</div>
                <span>${post.content}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <span class="date-text">${postDate}</span>
                <button type="button" class="btn-delete btn-post-delete" data-post-id="${post.id}">삭제</button>
              </div>
            </div>
            ${commentsHtml ? `<ul class="comment-list">${commentsHtml}</ul>` : ''}

            <!-- 👇 댓글 작성 폼 (닉네임/비번 포함) -->
            <div class="comment-write">
              <div class="comment-inputs">
                <input type="text" id="commentNick-${post.id}" placeholder="닉네임" maxlength="10" style="width:70px; flex:none;">
                <input type="password" id="commentPw-${post.id}" placeholder="비밀번호" style="width:70px; flex:none;">
              </div>
              <div style="display:flex; gap:6px;">
                <input type="text" id="commentInput-${post.id}" aria-label="댓글 입력" placeholder="댓글 달기...">
                <button type="button" class="btn-comment-submit" data-post-id="${post.id}">작성</button>
              </div>
            </div>
          </li>
        `;
        });

        if (isInitial) {
            feedList.innerHTML = html;
        } else {
            feedList.innerHTML += html;
        }

        document.querySelectorAll('.btn-comment-submit').forEach(btn => {
            btn.onclick = function() {
                const postId = this.getAttribute('data-post-id');
                createComment(postId);
            };
        });

        document.querySelectorAll('.btn-post-delete').forEach(btn => {
            btn.onclick = function() {
                const postId = this.getAttribute('data-post-id');
                deletePost(postId);
            };
        });

        document.querySelectorAll('.btn-comment-delete').forEach(btn => {
            btn.onclick = function() {
                const commentId = this.getAttribute('data-comment-id');
                deleteComment(commentId);
            };
        });

        if (moreBtnSection) {
            moreBtnSection.style.display = isLastPage ? 'none' : 'block';
        }
    }
</script>
</body>
</html>
