<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모두의 결과 - 2026 올해의 책</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
        body {
            background-color: #f1f5f9;
            background-image:
                radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.18) 0, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(16, 185, 129, 0.15) 0, transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(251, 146, 60, 0.12) 0, transparent 35%);
            background-attachment: fixed;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen text-gray-800 font-sans">

<div class="max-w-5xl mx-auto p-4 md:p-8">
    <div class="mt-4 mb-8 text-center">
        <h1 class="text-2xl md:text-4xl font-bold text-gray-900 mb-2">모두의 올해의 책</h1>
        <p class="text-gray-500 text-sm">2026년, 우리가 선택한 책들</p>
    </div>

    <div id="gallery" class="pb-12">
        <p class="text-gray-400 py-20 text-center">불러오는 중...</p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://skpmxrgewpdmlvckzekh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1dV_gRdjg3NTWyBiD56t_A_BH-HESQ6';
    let sb = null;
    try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'yearly' } }); } catch(e) { console.warn('Supabase 초기화 실패:', e); }
    const TABLE = 'book_of_the_year';

    // 카카오 CDN이 CORS 미지원 → 프록시로 우회
    function proxyImg(url) {
        if (!url) return '';
        return `https://images.weserv.nl/?url=${encodeURIComponent(url)}`;
    }

    const CATEGORIES = ['올해의 책', '올해의 도전 책', '올해의 프로책', '올해의 실망책', '올해의 유익한 책'];

    // 한 사람 = 표의 한 행
    function buildRow(d) {
        const byCat = {};
        (d.books || []).forEach(b => { if (b && b.category) byCat[b.category] = b; });
        return `
    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
      <td class="px-3 py-3 font-semibold text-slate-700 text-sm whitespace-nowrap align-middle sticky left-0 bg-white">${d.nickname}</td>
      ${CATEGORIES.map(cat => {
            const b = byCat[cat];
            return `
        <td class="px-0.5 py-3 align-top">
          <div class="flex flex-col items-center w-[64px] mx-auto">
            <div class="w-[64px] h-[92px] rounded overflow-hidden bg-slate-100 shadow-sm flex-shrink-0">
              ${b && b.thumbnail ? `<img src="${proxyImg(b.thumbnail)}" class="w-full h-full object-cover" />` : ''}
            </div>
            <p class="text-[10px] text-slate-500 text-center mt-1 leading-tight w-[64px] truncate">${b ? (b.title || '') : ''}</p>
          </div>
        </td>`;
        }).join('')}
    </tr>`;
    }

    function buildTable(rows) {
        return `
    <div class="bg-white rounded-2xl shadow-sm overflow-x-auto w-fit max-w-full mx-auto">
      <table class="border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200">
            <th class="px-3 py-3 text-left text-xs font-bold text-slate-600 whitespace-nowrap sticky left-0 bg-slate-50">이름</th>
            ${CATEGORIES.map(c => `<th class="px-1 py-3 text-center text-xs font-bold text-[#2563eb] whitespace-nowrap">${c}</th>`).join('')}
          </tr>
        </thead>
        <tbody>${rows.map(buildRow).join('')}</tbody>
      </table>
    </div>`;
    }

    async function loadGallery() {
        const gallery = document.getElementById('gallery');
        try {
            const { data, error } = await sb.from(TABLE).select('*').order('created_at', { ascending: false });
            if (error) throw error;
            if (!data.length) {
                gallery.innerHTML = '<p class="text-gray-400 py-20 text-center">아직 제출된 결과가 없습니다</p>';
                return;
            }
            gallery.innerHTML = buildTable(data);
        } catch (e) {
            gallery.innerHTML = '<p class="text-red-400 py-20 text-center">데이터를 불러오지 못했습니다</p>';
        }
    }

    loadGallery();
</script>
</body>
</html>
