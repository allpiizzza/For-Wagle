<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 온라인 프로그램</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        :root {
            --blue: #2563eb;
            --blue-soft: #eff6ff;
            --ink: #1e293b;
            --ink-2: #475569;
            --muted: #94a3b8;
            --line: #e8edf3;
            --bg: #f4f6fa;
            --red: #dc2626;
            --green: #16a34a;
            --wood-1: #d9b98f;
            --wood-2: #b98c5c;
        }
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }
        body {
            margin: 0;
            padding: 20px 16px 40px;
            background: var(--bg);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.6;
            word-break: keep-all;
            overflow-wrap: break-word;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            overflow: clip;
        }

        /* 헤더 */
        .hero {
            padding: 20px 24px 26px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 60%, #60a5fa 100%);
            color: #ffffff;
        }
        .back {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.85;
            margin-bottom: 12px;
        }
        .back:hover { opacity: 1; }
        .hero h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .hero p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* 상단 바: 요약 + 범례 */
        .bar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px 12px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
            font-size: 0.78rem;
            color: var(--muted);
        }
        .legend {
            display: flex;
            gap: 10px;
        }
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .legend i {
            display: inline-block;
            width: 9px;
            height: 14px;
            border-radius: 2px;
        }
        .lg-read { background: #64748b; }
        .lg-next { background: #e2e8f0; border: 1.5px solid #64748b; box-shadow: 0 0 0 2px #fde68a; }
        .lg-todo { background: #ffffff; border: 1.5px dashed #94a3b8; }

        main { padding: 18px 22px 24px; }

        /* ===== 책장 한 칸 ===== */
        .shelf {
            margin: 0 0 22px;
        }
        .shelf-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 4px;
            padding: 0 2px;
        }
        .shelf-name {
            font-weight: 800;
            font-size: 1rem;
            color: var(--ink);
        }
        .shelf-name::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--c);
            margin-right: 7px;
            vertical-align: 2px;
        }
        .shelf-count {
            flex-shrink: 0;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--muted);
        }
        .shelf-count.done { color: var(--green); }

        /* 책장이 넘치면 옆으로 밀어서 보기 */
        .shelf-scroll {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px 12px 5px 5px;
        }
        .shelf-scroll::-webkit-scrollbar { display: none; }
        .shelf-inner {
            width: max-content;
            min-width: 100%;
            padding-bottom: 10px; /* 선반 그림자 자리 */
        }
        /* 밀 수 있을 때 오른쪽 끝을 흐리게 */
        .shelf-wrap { position: relative; }
        .shelf-wrap.more::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 28px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0), #ffffff);
            pointer-events: none;
            border-radius: 0 12px 0 0;
        }
        .shelf-hint {
            display: none;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            margin-left: 6px;
        }
        .shelf.scrollable .shelf-hint { display: inline; }
        .books {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            min-height: 220px;
            padding: 36px 10px 0;
            background: linear-gradient(#fbf8f3, #f5efe6);
            border-radius: 12px 12px 0 0;
        }
        .plank {
            height: 11px;
            background: linear-gradient(var(--wood-1), var(--wood-2));
            border-radius: 2px 2px 5px 5px;
            box-shadow: 0 4px 8px rgba(120, 80, 40, 0.18);
        }

        /* 책등 */
        .spine {
            --h: 120px;
            position: relative;
            flex: 0 0 36px;
            height: var(--h);
            padding: 0;
            border: none;
            border-radius: 3px 3px 1px 1px;
            background: var(--c);
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(.3, 1.4, .5, 1), box-shadow 0.2s;
            animation: drop 0.5s ease backwards;
            animation-delay: calc(var(--i) * 0.04s);
        }
        /* 책마다 살짝 다른 색 */
        .spine:nth-child(3n+2) { filter: brightness(1.13) saturate(0.9); }
        .spine:nth-child(3n) { filter: brightness(0.9); }
        /* 책등 장식 띠 */
        .spine::before, .spine::after {
            content: "";
            position: absolute;
            left: 3px;
            right: 3px;
            height: 2px;
            background: currentColor;
            opacity: 0.35;
        }
        .spine::before { top: 7px; }
        .spine::after { bottom: 7px; }
        /* 책등 제목: 세로쓰기, 길면 글씨를 줄이고 두 줄로 */
        .spine-title {
            position: absolute;
            top: 14px;
            bottom: 14px;
            left: 2px;
            right: 2px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            writing-mode: vertical-lr; /* 두 줄일 때 왼쪽 줄부터 */
            font-size: 11px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: 0.01em;
            word-break: keep-all;
            overflow: hidden;
        }
        .tcy {
            text-combine-upright: all;
            -webkit-text-combine: horizontal;
        }
        .spine-check {
            position: absolute;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            font-size: 9px;
            font-weight: 900;
            opacity: 0.85;
        }
        .spine.read .spine-title { bottom: 24px; }

        /* 아직 안 읽은 책: 테두리만 */
        .spine.todo {
            background: #ffffff;
            color: var(--c);
            box-shadow: inset 0 0 0 1.5px var(--c);
            filter: none;
            opacity: 0.75;
        }
        .spine.todo::before, .spine.todo::after { opacity: 0.25; }

        /* 다음 책: 살짝 뽑혀 나와 반짝 */
        .spine.next {
            background: color-mix(in srgb, var(--c) 16%, #ffffff);
            color: var(--c);
            box-shadow: inset 0 0 0 2px var(--c), 0 0 0 3px #fde68a;
            filter: none;
            opacity: 1;
            transform: translateY(-10px);
        }
        .spine.next .spine-pin {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            font-weight: 900;
            color: #ffffff;
            background: var(--red);
            border-radius: 999px;
            padding: 1px 5px;
            white-space: nowrap;
            line-height: 1.4;
        }

        /* 누른 책: 위로 뽑힘 */
        .spine.selected {
            transform: translateY(-16px);
            box-shadow: 0 8px 14px rgba(15, 23, 42, 0.18);
            z-index: 1;
        }
        .spine.next.selected {
            box-shadow: inset 0 0 0 2px var(--c), 0 0 0 3px #fde68a, 0 8px 14px rgba(15, 23, 42, 0.18);
        }
        .spine.todo.selected { opacity: 1; }
        @media (hover: hover) {
            .spine:not(.selected):hover { transform: translateY(-6px); }
            .spine.next:not(.selected):hover { transform: translateY(-13px); }
        }
        .spine:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }
        @keyframes drop {
            from { opacity: 0; transform: translateY(-14px); }
        }

        /* 책 정보 카드 */
        .info {
            display: none;
            margin-top: 10px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-left: 4px solid var(--c);
            border-radius: 4px 12px 12px 4px;
            background: #ffffff;
            animation: pop 0.2s ease;
        }
        .info.show { display: block; }
        @keyframes pop {
            from { opacity: 0; transform: translateY(-4px); }
        }
        .info-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted);
        }
        .info-title {
            margin: 2px 0 1px;
            font-size: 1.02rem;
            font-weight: 800;
            color: var(--ink);
        }
        .info-sub {
            font-size: 0.82rem;
            color: var(--ink-2);
        }
        .badge {
            flex-shrink: 0;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 9px;
            border-radius: 999px;
            background: #f1f5f9;
            color: var(--muted);
        }
        .badge.next { background: var(--blue); color: #ffffff; }
        .badge.today { background: var(--red); color: #ffffff; }
        .badge.todo { background: var(--blue-soft); color: var(--blue); }

        footer {
            text-align: center;
            font-size: 0.78rem;
            color: var(--muted);
            padding: 20px 24px 26px;
            border-top: 8px solid var(--bg);
        }

        @media (max-width: 480px) {
            body { padding: 0 0 24px; font-size: 14.5px; }
            .container { border-radius: 0; box-shadow: none; }
            main { padding: 16px 14px 20px; }
            .books { padding: 36px 8px 0; }
            .spine { flex-basis: 32px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .spine, .info { animation: none; transition: none; }
        }
    </style>
</head>

    // 프로그램별 책 색
    const COLORS = ['#c2410c', '#0f766e', '#1e40af', '#9f1239', '#6d28d9', '#a16207', '#15803d',
                    '#b91c1c', '#be185d', '#334155', '#0369a1', '#7c2d12', '#4d7c0f'];

    const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    function parseDate(s) {
        const [y, m, d] = s.split('-').map(Number);
        return new Date(y, m - 1, d);
    }
    function esc(s) {
        return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function daysLeft(date) {
        return Math.round((date - today) / 86400000);
    }
    // 쪽수 → 책등 높이 (184쪽 ≈ 108px, 719쪽 ≈ 176px)
    function spineHeight(pages) {
        const p = Math.min(Math.max(pages || 300, 150), 750);
        return Math.round(104 + (p - 150) / 600 * 76);
    }
    // 책등에는 짧게: "해리포터와" 생략, 긴 괄호 설명(장 범위·부제)은 카드에서만
    function spineLabel(title) {
        return title.replace(/^해리포터와 /, '').replace(/\s*\([^)]{3,}\)/, '');
    }

    // 데이터 정리
    const shelves = PROGRAMS.map((p, pi) => {
        const books = p.sessions.map(([ds, title, pages, pub], i) => {
            const date = parseDate(ds);
            return { date, title, pages, pub, i, state: date < today ? 'read' : 'todo' };
        });
        const next = books.find(b => b.state === 'todo');
        if (next) next.state = 'next';
        return { name: p.name, color: COLORS[pi % COLORS.length], books, next };
    });

    // 그리기
    let totalLeft = 0;
    const root = document.getElementById('programs');
    root.innerHTML = shelves.map((s, si) => {
        const read = s.books.filter(b => b.state === 'read').length;
        totalLeft += s.books.length - read;
        const done = read === s.books.length;
        const spines = s.books.map(b => `
            <button type="button" class="spine ${b.state}" style="--h:${spineHeight(b.pages)}px;--i:${b.i}"
                data-shelf="${si}" data-book="${b.i}" aria-label="${esc(b.title)}" aria-pressed="false">
                ${b.state === 'next' ? `<span class="spine-pin">${daysLeft(b.date) === 0 ? 'TODAY' : 'NEXT'}</span>` : ''}
                <span class="spine-title">${upright(esc(spineLabel(b.title)))}</span>
                ${b.state === 'read' ? '<span class="spine-check">✓</span>' : ''}
            </button>`).join('');
        return `<section class="shelf" style="--c:${s.color}">
            <div class="shelf-head">
                <span class="shelf-name">${esc(s.name)}<span class="shelf-hint">밀어서 보기 →</span></span>
                <span class="shelf-count${done ? ' done' : ''}">${done ? '완주 🎉' : `${read} / ${s.books.length}권`}</span>
            </div>
            <div class="shelf-wrap">
                <div class="shelf-scroll">
                    <div class="shelf-inner">
                        <div class="books">${spines}</div>
                        <div class="plank"></div>
                    </div>
                </div>
            </div>
            <div class="info" aria-live="polite"></div>
        </section>`;
    }).join('');

    document.getElementById('summary-info').textContent =
        `프로그램 ${PROGRAMS.length}개 · 남은 모임 ${totalLeft}회`;

    // 책 선택 → 정보 카드
    function select(si, bi) {
        const shelfEl = root.children[si];
        const info = shelfEl.querySelector('.info');
        const spines = shelfEl.querySelectorAll('.spine');
        const wasSelected = spines[bi].classList.contains('selected');

        spines.forEach(el => { el.classList.remove('selected'); el.setAttribute('aria-pressed', 'false'); });
        if (wasSelected) { info.classList.remove('show'); return; }

        spines[bi].classList.add('selected');
        spines[bi].setAttribute('aria-pressed', 'true');

        const s = shelves[si], b = s.books[bi];
        const m = String(b.date.getMonth() + 1).padStart(2, '0');
        const d = String(b.date.getDate()).padStart(2, '0');
        const left = daysLeft(b.date);
        let badge;
        if (b.state === 'read') badge = '<span class="badge">읽었어요 ✓</span>';
        else if (left === 0) badge = '<span class="badge today">오늘 모임!</span>';
        else badge = `<span class="badge ${b.state}">D-${left}</span>`;
        const sub = [b.pages ? b.pages + '쪽' : '', b.pub, `${s.books.length}권 중 ${bi + 1}번째`].filter(Boolean).join(' · ');

        info.innerHTML = `
            <div class="info-top"><span>${m}.${d} ${DAYS[b.date.getDay()]}요일</span>${badge}</div>
            <div class="info-title">${esc(b.title)}</div>
            <div class="info-sub">${esc(sub)}</div>`;
        info.classList.remove('show');
        void info.offsetWidth; // 애니메이션 다시 재생
        info.classList.add('show');
    }

    root.addEventListener('click', e => {
        const btn = e.target.closest('.spine');
        if (btn) select(+btn.dataset.shelf, +btn.dataset.book);
    });

    // 처음엔 각 칸의 "다음 책"을 펼쳐둠
    shelves.forEach((s, si) => { if (s.next) select(si, s.next.i); });

    // 책장이 넘치는 칸: 힌트 표시 + 다음 책이 보이게 스크롤
    function updateScrollable() {
        root.querySelectorAll('.shelf').forEach((shelfEl, si) => {
            const sc = shelfEl.querySelector('.shelf-scroll');
            const wrap = shelfEl.querySelector('.shelf-wrap');
            const over = sc.scrollWidth > sc.clientWidth + 1;
            shelfEl.classList.toggle('scrollable', over);
            const setMore = () => wrap.classList.toggle('more', over && sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 4);
            if (over && !sc.dataset.init && shelves[si].next) {
                const sp = shelfEl.querySelectorAll('.spine')[shelves[si].next.i];
                sc.scrollLeft = sp.offsetLeft + sp.offsetWidth / 2 - sc.clientWidth / 2;
            }
            sc.dataset.init = '1';
            setMore();
            sc.onscroll = setMore;
        });
    }
    updateScrollable();
    window.addEventListener('resize', updateScrollable);

    // 세로쓰기에서 숫자(1, 10, 1/2)는 눕지 않고 똑바로 서게
    function upright(html) {
        return html.replace(/\d+(?:\/\d+)?/g, '<span class="tcy">$&</span>');
    }

    // 책등 제목이 넘치면 글씨를 조금씩 줄임 (최소 8px)
    function fitSpines() {
        document.querySelectorAll('.spine-title').forEach(el => {
            let size = 11;
            el.style.fontSize = size + 'px';
            while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > 8) {
                size -= 0.5;
                el.style.fontSize = size + 'px';
            }
        });
    }
    fitSpines();
    if (document.fonts) document.fonts.ready.then(fitSpines);
    let fitTimer;
    window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitSpines, 150); });

    // 새로고침하면 항상 맨 위에서 시작
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.addEventListener('load', function () {
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
        window.scrollTo(0, 0);
    });
</script>

</body>
</html>
