<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 온라인 프로그램</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        :root {
            --blue: #2563eb;
            --blue-soft: #eff6ff;
            --ink: #1e293b;
            --ink-2: #475569;
            --muted: #94a3b8;
            --line: #e8edf3;
            --bg: #f4f6fa;
            --amber-soft: #fffbeb;
            --amber: #f59e0b;
            --red: #dc2626;
            --red-soft: #fef2f2;
            --green: #16a34a;
            --green-soft: #f0fdf4;
            --hl: #fde68a;
        }
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            padding: 20px 16px 40px;
            background: var(--bg);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.75;
            word-break: keep-all;
            overflow-wrap: break-word;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            overflow: clip;
        }

        /* 헤더 */
        .hero {
            padding: 20px 24px 26px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 60%, #60a5fa 100%);
            color: #ffffff;
        }
        .back {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.85;
            margin-bottom: 12px;
        }
        .back:hover { opacity: 1; }
        .hero h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        /* 목차 */
        .toc {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .toc-links {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            flex: 1;
            padding-right: 24px;
            /* 오른쪽 끝을 흐리게 → 옆으로 더 있다는 힌트 */
            -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
            mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
        }
        .toc-links::-webkit-scrollbar { display: none; }
        .toc a, .toc button {
            flex-shrink: 0;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 999px;
            text-decoration: none;
            white-space: nowrap;
        }
        .toc a {
            color: var(--ink-2);
            background: #f1f5f9;
        }
        .toc a:hover { background: var(--blue-soft); color: var(--blue); }
        .toc button {
            border: 1px solid var(--line);
            background: #ffffff;
            color: var(--blue);
            cursor: pointer;
        }

        /* 섹션 */
        section {
            padding: 28px 22px 24px;
            scroll-margin-top: 56px;
        }
        section + section { border-top: 8px solid var(--bg); }
        .sec-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 14px;
        }
        .sec-num {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--blue);
            letter-spacing: 0.04em;
        }
        h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }
        p { margin: 0 0 10px; }
        strong { font-weight: 700; color: var(--ink); }
        /* 밑줄 강조 → 형광펜 */
        /* 빨간 물결 밑줄 */
        .wavy {
            text-decoration: underline wavy #ef4444;
            text-decoration-thickness: 1.5px;
            text-underline-offset: 5px;
            text-decoration-skip-ink: none;
        }
        u {
            text-decoration: none;
            background: linear-gradient(transparent 58%, var(--hl) 58%);
        }

        /* 강조 박스 */
        .note {
            border-left: 4px solid var(--blue);
            background: var(--blue-soft);
            border-radius: 0 12px 12px 0;
            padding: 12px 16px;
            margin: 12px 0;
        }
        .note.warn { border-color: var(--red); background: var(--red-soft); }
        .note.tip { border-color: var(--amber); background: var(--amber-soft); }
        .note p { margin-bottom: 4px; }
        .note p:last-child { margin-bottom: 0; }
        .note ul:last-child { margin-bottom: 0; }

        /* 일반 목록 */
        ul {
            margin: 6px 0 10px;
            padding-left: 0;
            list-style: none;
        }
        ul > li {
            position: relative;
            padding-left: 16px;
            margin: 6px 0;
            color: var(--ink-2);
        }
        ul > li::before {
            content: "";
            position: absolute;
            left: 3px;
            top: 0.75em;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--muted);
        }

        /* 번호 목록 */
        ol {
            margin: 6px 0 10px;
            padding-left: 0;
            list-style: none;
            counter-reset: step;
        }
        ol > li {
            position: relative;
            counter-increment: step;
            padding-left: 34px;
            margin: 0;
            padding-top: 10px;
            padding-bottom: 10px;
        }
        ol > li + li { border-top: 1px solid var(--line); }
        ol > li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--blue-soft);
            color: var(--blue);
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 목록 안의 작은 번호 목록 */
        ol ol > li {
            padding-top: 4px;
            padding-bottom: 4px;
            padding-left: 26px;
            border-top: none;
            color: var(--ink-2);
        }
        ol ol > li::before {
            top: 7px;
            width: 18px;
            height: 18px;
            font-size: 0.7rem;
            background: #f1f5f9;
            color: var(--ink-2);
        }
        .sub {
            display: block;
            font-size: 0.88rem;
            color: var(--muted);
        }
        .bad { color: var(--red); }

        /* 양식 */
        .template {
            margin: 10px 0;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            font-size: 0.88rem;
            color: var(--ink-2);
            white-space: pre-line;
            line-height: 1.8;
        }
        /* 설명 이미지 */
        .shot { margin: 10px 0 4px; }
        .shot-scroll {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffff;
            -webkit-overflow-scrolling: touch;
        }
        .shot img {
            display: block;
            width: 100%;
            height: auto;
        }
        .shot figcaption {
            margin-top: 4px;
            font-size: 0.78rem;
            color: var(--muted);
        }
        .shot-hint { display: none; }
        @media (max-width: 700px) {
            .shot-hint { display: inline; }
            /* 폰에서 글씨가 너무 작아지지 않게 → 옆으로 밀어서 보기 */
            .shot img { min-width: 640px; }
        }

        /* 방 나누기 예시 표 */
        .split-table { margin: 10px 0 6px; }
        .split-table table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            font-size: 0.88rem;
            text-align: center;
        }
        .split-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .split-table th {
            background: var(--blue-soft);
            color: var(--blue);
            font-weight: 700;
            padding: 8px 6px;
        }
        .split-table td {
            padding: 7px 6px;
            border-top: 1px solid var(--line);
            color: var(--ink-2);
        }
        .split-table td:first-child { font-weight: 700; color: var(--ink); }
        .split-table th + th,
        .split-table td + td { border-left: 1px solid var(--line); }

        /* 단계 소제목 (총대 가이드) */
        .stage {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0 2px;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--ink);
        }
        .toggle-body > .stage:first-child { margin-top: 6px; }
        .stage .step {
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            color: #ffffff;
            background: var(--blue);
            border-radius: 999px;
            padding: 2px 8px;
        }

        .template-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 2px;
        }

        /* 토글 */
        details {
            border: 1px solid var(--line);
            border-radius: 14px;
            margin: 10px 0;
            background: #ffffff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        details[open] {
            border-color: #bfdbfe;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.06);
        }
        summary {
            cursor: pointer;
            list-style: none;
            position: relative;
            display: block;
            padding: 14px 44px 14px 16px;
            font-weight: 700;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after {
            content: "";
            position: absolute;
            right: 18px;
            top: 50%;
            width: 8px;
            height: 8px;
            margin-top: -6px;
            border-right: 2px solid var(--muted);
            border-bottom: 2px solid var(--muted);
            transform: rotate(45deg);
            transition: transform 0.2s;
        }
        details[open] > summary::after {
            margin-top: -2px;
            transform: rotate(-135deg);
            border-color: var(--blue);
        }
        details[open] > summary {
            color: var(--blue);
            border-bottom: 1px solid var(--line);
        }
        summary:hover { color: var(--blue); }
        .toggle-body {
            padding: 12px 18px 16px;
        }

        /* 함께 지켜요 */
        .promise li {
            padding: 12px 0 12px 26px;
            margin: 0;
            color: var(--ink);
        }
        .promise li + li { border-top: 1px solid var(--line); }
        /* 파란 화살표(›) 마커: 첫 줄 가운데에 맞춤 */
        .promise li::before {
            width: 7px;
            height: 7px;
            left: 4px;
            top: calc(12px + 0.875em - 4px);
            border-radius: 0;
            background: none;
            border-right: 2px solid var(--blue);
            border-bottom: 2px solid var(--blue);
            transform: rotate(-45deg);
        }

        /* 스포 예시 */
        .example {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            margin: 10px 0;
        }
        .example-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .quote {
            color: var(--ink-2);
            padding-left: 12px;
            border-left: 3px solid var(--line);
            margin-bottom: 10px;
        }
        .verdict {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }
        .verdict + .verdict { border-top: 1px dashed var(--line); }
        .badge {
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 999px;
        }
        .badge.ok { background: var(--green-soft); color: var(--green); }
        .badge.no { background: var(--red-soft); color: var(--red); }

        footer {
            text-align: center;
            font-size: 0.78rem;
            color: var(--muted);
            padding: 20px 24px 26px;
            border-top: 8px solid var(--bg);
        }

        @media (max-width: 480px) {
            body { padding: 0 0 24px; font-size: 14.5px; }
            .container { border-radius: 0; box-shadow: none; }
            section { padding: 24px 18px 20px; }
            .toggle-body { padding: 12px 14px 14px; }
            /* 모바일: 목차를 두 줄로 감싸서 전부 보이게 */
            .toc { padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
            .toc-links { display: contents; }
            section { scroll-margin-top: 100px; }
        }
    </style>
    <style>
        /* ===== 입문서 전용 ===== */
        .mini-title {
            margin: 16px 0 4px;
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--ink);
        }
        p.sub { display: block; }
        .nowrap { white-space: nowrap; }

        /* 핵심 정보 칩 */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0 0 10px;
        }
        .chip {
            display: inline-block;
            font-size: 0.74rem;
            font-weight: 700;
            line-height: 1.4;
            padding: 3px 9px;
            border-radius: 999px;
            background: #f1f5f9;
            color: var(--ink-2);
            vertical-align: middle;
        }
        .chip.ok { background: var(--green-soft); color: var(--green); }
        .chip.no { background: #f1f5f9; color: var(--muted); }
        .chip.warn { background: var(--red-soft); color: var(--red); }
        .chips.books .chip { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
        summary .chip { margin-left: 4px; }

        /* 종류 비교 카드 */
        .kind-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .kind {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            background: #fbfcfe;
        }
        .kind-title {
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .kind p { margin-bottom: 4px; }
        .kind p:last-child { margin-bottom: 0; }
        .kind ol { margin-bottom: 0; }

        /* 지기 역할 */
        .role-list {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
        }
        .role {
            display: grid;
            grid-template-columns: 92px 1fr;
            gap: 10px;
            padding: 10px 14px;
            color: var(--ink-2);
        }
        .role + .role { border-top: 1px solid var(--line); }
        .role-name { font-weight: 800; color: var(--blue); }

        /* Q&A */
        .qa summary { padding-left: 46px; }
        .q {
            position: absolute;
            left: 16px;
            top: 15px;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: var(--blue);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .kind-grid { grid-template-columns: 1fr; }
            .role { grid-template-columns: 1fr; gap: 2px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="hero">
        <a class="back" href="noticeList.html">‹ 목록으로</a>
        <h1>2027 온라인 프로그램</h1>
    </header>

    <main>
        <section id="intro">
            <div class="sec-head">
                <span class="sec-num">01</span>
                <h2>프로그램 소개</h2>
            </div>
            <div class="note tip">
                <p>2027 온라인 프로그램 내용을 준비 중이에요 🐑</p>
            </div>
        </section>
    </main>

    <footer>오늘도 와글와글 📚</footer>
</div>

<script>
    // 새로고침하면 항상 맨 위에서 시작
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.addEventListener('load', function () {
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
        window.scrollTo(0, 0);
    });
</script>

</body>
</html>
