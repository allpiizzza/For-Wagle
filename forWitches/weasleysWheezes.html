<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>와즐리 자매의 장난감 가게</title>
    <!-- Google Fonts: Fredoka & Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-cream: #fdfaf3;
            --bg-card: rgba(255, 253, 247, 0.96);
            --yellow-main: #f59e0b;
            --yellow-light: #fffbeb;
            --yellow-neon: #ffdd00;
            --yellow-border: #fcd34d;
            --butter-gold: #d97706;
            --text-dark: #3f2e18;
            --text-sub: #78644f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 24px 16px 80px;
        }

        /* 🍬 배경 캔버스: 둥둥 떠다니는 파스텔 젤리빈 & 네온 별가루 */
        #jellybeanCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1060px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 🎪 상단 헤더 */
        header {
            text-align: center;
            padding: 26px 18px 24px;
            margin-bottom: 22px;
            background: linear-gradient(180deg, #ffffff 0%, #fffdf5 70%, #fff8dc 100%);
            border: 2.5px solid var(--yellow-border);
            border-radius: 32px;
            box-shadow:
                    0 8px 30px rgba(245, 158, 11, 0.12),
                    0 0 20px rgba(254, 240, 138, 0.5),
                    inset 0 0 18px rgba(254, 243, 199, 0.7);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; height: 6px;
            background: linear-gradient(90deg, #ff70a6, #ff9770, #ffd670, #e9ff70, #70d6ff, #ff70a6);
            background-size: 200% 100%;
            animation: rainbowGlow 6s linear infinite;
        }

        @keyframes rainbowGlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .shop-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fef08a;
            color: #854d0e;
            font-weight: 800;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            border: 1px solid #fde047;
            margin-bottom: 12px;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.45);
        }

        header h1 {
            font-family: 'Fredoka', 'Pretendard', sans-serif;
            font-size: 30px;
            font-weight: 800;
            color: #92400e;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(253, 224, 71, 0.7), 2px 2px 0px #fff;
        }

        header p {
            font-size: 13.5px;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* 🍺 대시보드 바 */
        .dashboard-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            border: 2px solid #fde68a;
            padding: 14px 20px;
            border-radius: 22px;
            margin-bottom: 26px;
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.08), 0 0 15px rgba(254, 240, 138, 0.4);
            backdrop-filter: blur(8px);
        }

        .wallet-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wallet-badge {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 1.5px solid #f59e0b;
            padding: 6px 14px;
            border-radius: 14px;
            gap: 7px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.2);
        }

        .wallet-badge .icon {
            font-size: 20px;
        }

        .wallet-badge span.txt {
            font-size: 12.5px;
            font-weight: 700;
            color: #92400e;
        }

        .wallet-badge strong {
            font-size: 20px;
            font-weight: 900;
            color: #b45309;
        }

        .btn-charge {
            background: #ffffff;
            color: #b45309;
            font-size: 12px;
            font-weight: 800;
            padding: 7px 11px;
            border-radius: 10px;
            border: 1.5px dashed #f59e0b;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-charge:hover {
            background: #fffbeb;
            border-color: #d97706;
            transform: scale(1.04);
        }

        .dash-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            cursor: pointer;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            padding: 9px 15px;
            border: none;
            transition: all 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-bag {
            background: #fdf6ec;
            color: #9a3412;
            border: 1.5px solid #fdba74;
            box-shadow: 0 2px 6px rgba(251, 146, 60, 0.2);
        }
        .btn-bag:hover {
            background: #fff1e0;
            transform: translateY(-2px);
        }

        .btn-admin {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            color: #713f12;
            border: 1.5px solid #eab308;
            box-shadow: 0 3px 10px rgba(234, 179, 8, 0.3);
        }
        .btn-admin:hover {
            background: #fde047;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(234, 179, 8, 0.45);
        }

        /* 🛍️ 아이템 쇼룸 그리드 */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 22px;
            margin-bottom: 28px;
        }

        .item-card {
            background: var(--bg-card);
            border: 2px solid #fed7aa;
            border-radius: 28px;
            padding: 16px 16px 18px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.08), 0 0 16px rgba(254, 240, 138, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(6px);
            overflow: hidden;
        }

        .item-card:hover {
            transform: translateY(-6px);
            border-color: #f59e0b;
            box-shadow: 0 14px 32px rgba(217, 119, 6, 0.16), 0 0 24px rgba(251, 191, 36, 0.55);
        }

        /* 뱃지 */
        .item-badge {
            position: absolute;
            top: 14px;
            left: 16px;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 11px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .badge-hot { background: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; }
        .badge-best { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
        .badge-new { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .badge-rare { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }

        /* 🖼️ 카드 1/3을 꽉 채우는 큼직한 이미지/이모지 쇼케이스 /
        .item-media-showcase {
          width: 100%;
          height: 180px; / 카드 상단 약 3분의 1을 차지하는 시원한 크기 */
        border-radius: 20px;
        background: linear-gradient(135deg, #fffdf7 0%, #fff6e0 100%);
        border: 1.5px solid #fde68a;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 0 14px rgba(254, 240, 138, 0.35);
        transition: transform 0.3s ease;
        }

        .item-card:hover .item-media-showcase {
            transform: scale(1.02);
        }

        /* 큼직한 이미지 스타일 /
        .item-media-showcase img.showcase-img {
          width: 100%;
          height: 100%;
          object-fit: cover; / 1/3 칸을 꽉 채워 풍성하게 */
        display: block;
        transition: transform 0.35s ease;
        }
        .item-card:hover .item-media-showcase img.showcase-img {
            transform: scale(1.06);
        }

        /* 이모지일 때도 큼직하게 72px */
        .item-media-showcase span.showcase-emoji {
            font-size: 72px;
            filter: drop-shadow(0 6px 14px rgba(245, 158, 11, 0.3));
            transition: transform 0.3s ease;
        }
        .item-card:hover .item-media-showcase span.showcase-emoji {
            transform: scale(1.15) rotate(4deg);
        }

        .item-name {
            font-size: 18px;
            font-weight: 800;
            color: #451a03;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .item-tag {
            align-self: center;
            font-size: 11.5px;
            font-weight: 700;
            color: #b45309;
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .item-desc {
            font-size: 12.5px;
            color: var(--text-sub);
            line-height: 1.55;
            text-align: center;
            margin-bottom: 16px;
            min-height: 38px;
            flex-grow: 1;
            padding: 0 4px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fffcf7;
            border-radius: 18px;
            padding: 10px 14px;
            border: 1px solid #feebc8;
        }

        .price-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13.5px;
            font-weight: 800;
            color: var(--butter-gold);
        }
        .price-tag strong {
            font-size: 19px;
            color: #92400e;
        }

        .btn-buy {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
            border: 1px solid #fbbf24;
        }
        .btn-buy:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(217, 119, 6, 0.45);
        }

        .admin-card-ctrls {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #fed7aa;
        }
        .btn-card-ctrl {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #fff;
            color: #8c7866;
            border: 1px solid #e7d8c6;
        }
        .btn-card-ctrl:hover {
            color: #92400e;
            border-color: #f59e0b;
        }
        .btn-card-del:hover {
            color: #ef4444;
            border-color: #fca5a5;
        }

        .banner-footer {
            text-align: center;
            padding: 16px 20px;
            background: rgba(255, 253, 247, 0.9);
            border: 2px dashed #fcd34d;
            border-radius: 20px;
            font-size: 13px;
            color: #92400e;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.08);
        }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 30, 15, 0.45);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            backdrop-filter: blur(6px);
        }

        .modal {
            background: #fffdf9;
            border: 2px solid #fcd34d;
            border-radius: 26px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.18), 0 0 25px rgba(254, 240, 138, 0.6);
            overflow: hidden;
            animation: popIn 0.22s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            padding: 18px 22px;
            background: #fffbeb;
            border-bottom: 1.5px solid #fde68a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 17px;
            font-weight: 900;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #9a3412;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px 22px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: #78350f;
            margin-bottom: 6px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            background: #fff;
            border: 1.5px solid #fed7aa;
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--text-dark);
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* 관리자 모달 내 큼직한 미리보기 */
        .image-upload-box {
            border: 1.5px dashed #f59e0b;
            background: #fffdf5;
            border-radius: 16px;
            padding: 14px;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .modal-preview-big {
            width: 100%;
            height: 140px;
            border-radius: 14px;
            border: 1.5px solid #fed7aa;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 52px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
        }
        .modal-preview-big img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-footer {
            padding: 14px 22px;
            background: #fffdf7;
            border-top: 1px solid #fee2e2;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-modal-cancel {
            background: #f3f4f6;
            color: #4b5563;
            border: 1px solid #d1d5db;
        }

        .btn-modal-submit {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            font-weight: 800;
            box-shadow: 0 3px 10px rgba(245, 158, 11, 0.3);
        }

        /* 🎒 가방 목록 */
        .bag-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bag-item {
            background: #fff;
            border: 1px solid #fde68a;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .bag-thumb {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 8px;
            border: 1px solid #fde68a;
        }
        .bag-item strong { color: #451a03; }
        .bag-item .date { font-size: 11px; color: #a8947f; }
        .bag-item .used-cost { font-weight: 800; color: #b45309; }

        /* 🍞 토스트 메시지 */
        #toastMessage {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fffdf5;
            color: #78350f;
            border: 2px solid #f59e0b;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 13.5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12), 0 0 20px rgba(251, 191, 36, 0.5);
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        #toastMessage.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<!-- 🍬 캔버스 배경: 젤리빈 & 네온 스파클 -->
<canvas id="jellybeanCanvas"></canvas>

<div class="container">
    <!-- 헤더 -->
    <header>
        <div class="shop-pill">✨ WEASLEYS & HONEYDUKES SWEET SHOP ✨</div>
        <h1>와즐리 자매의 장난감 가게 🍬</h1>
        <p>상점의 모든 마법 아이템은 <strong>🍺 버터맥주쿠폰</strong>으로 교환할 수 있습니다!</p>
    </header>

    <!-- 대시보드 바 -->
    <div class="dashboard-bar">
        <div class="wallet-section">
            <div class="wallet-badge">
                <span class="icon">🍺</span>
                <span class="txt">내 버터쿠폰:</span>
                <strong id="userCoupons">10</strong>
                <span class="txt">장</span>
            </div>
            <button class="btn-charge" onclick="openCouponModal()">+ 수량 설정</button>
        </div>

        <div class="dash-buttons">
            <button class="btn-bag" onclick="openBagModal()">🎒 내 마법 가방 (<span id="bagCount">0</span>)</button>
            <button class="btn-admin" onclick="openAdminModal()">🪄 신상 출시 (관리자)</button>
        </div>
    </div>

    <!-- 🛍️ 큼직한 이미지 카드로 구성된 쇼룸 그리드 -->
    <div class="shop-grid" id="shopGrid"></div>

    <!-- 하단 공지 -->
    <div class="banner-footer">
        🍯 <strong>허니듀크 & 위즐리 공지:</strong> 다양한 미션들로 <strong>🍺 버터쿠폰</strong>을 모아 기발한 마법 아이템으로 교환해 보세요!
    </div>
</div>

<!-- 토스트 알림창 -->
<div id="toastMessage">✨ 아이템을 교환했습니다!</div>

<!-- 1. 관리자 전용 신상 출시 & 편집 모달 -->
<div class="modal-overlay" id="adminModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="adminModalTitle">✨ 위즐리 신상 아이템 등록 (관리자)</h3>
            <button class="modal-close" onclick="closeAdminModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editItemId" value="" />
            <input type="hidden" id="itemImageData" value="" />

            <!-- 🖼️ 큼직한 이미지 선택 & 미리보기 -->
            <div class="form-group">
                <label>아이템 이미지 (사진 파일 등록 또는 이모지)</label>
                <div class="image-upload-box">
                    <div class="modal-preview-big" id="modalPreview">🍬</div>
                    <div style="width:100%; display:flex; flex-direction:column; gap:8px;">
                        <input type="file" id="itemImageFileInput" accept="image/*" style="font-size:12px;" onchange="handleImageFileSelect(event)" />
                        <div style="display:flex; gap:6px; align-items:center;">
                            <span style="font-size:12px; color:var(--text-sub);">또는 이모지 입력:</span>
                            <input type="text" id="itemEmojiInput" class="form-input" placeholder="🍬" maxlength="4" style="width:70px; padding:4px 8px; font-size:13px; text-align:center;" oninput="handleEmojiInput(event)" />
                            <button type="button" class="btn-card-ctrl" style="font-size:11px;" onclick="resetItemImage()">이미지 지우기</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>뱃지 종류</label>
                    <select id="itemBadgeInput" class="form-select">
                        <option value="HOT">HOT (인기폭발)</option>
                        <option value="BEST">BEST (스테디)</option>
                        <option value="NEW">NEW (신상품)</option>
                        <option value="RARE">RARE (희귀템)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>버터쿠폰 가격 (🍺)</label>
                    <input type="number" id="itemPriceInput" class="form-input" min="1" max="50" value="2" />

<script>
    const ADMIN_PW = "0628";

    // 기본 시그니처 8개 아이템

        },
        {
            id: "item_4",
            emoji: "🧦",
            image: "",
            name: "도비의 자유 양말",

        },

            price: 2,
            desc: "뚜껑을 열면 통통 튀는 행운! 기숙사 모래시계에 즉시 보너스 보석 1개를 적립해 주는 달콤한 간식."
        },
        {
            id: "item_8",
            emoji: "🧶",
            image: "",
            name: "피그미 퍼프 (애완 복슬이)",
            badge: "RARE",
            tag: "24시간 독서 프로필 마스코트",
            price: 3,
            desc: "지니 위즐리가 어깨에 얹고 다니던 분홍빛 털뭉치! 하루 동안 단톡방과 출석부에서 스페셜 마스코트 칭호를 얻습니다."
        }
    ];

    let items = [];
    let userCoupons = 10;
    let myBag = [];
    let isAdminAuth = false;

    function loadData() {
        try {
            const savedItems = localStorage.getItem("weasleys_jelly_items_v4");
            const savedCoupons = localStorage.getItem("weasleys_jelly_coupons_v4");
            const savedBag = localStorage.getItem("weasleys_jelly_bag_v4");

            items = savedItems ? JSON.parse(savedItems) : DEFAULT_ITEMS.slice();
            userCoupons = savedCoupons !== null ? parseInt(savedCoupons, 10) : 10;
            myBag = savedBag ? JSON.parse(savedBag) : [];
        } catch (e) {
            items = DEFAULT_ITEMS.slice();
            userCoupons = 10;
            myBag = [];
        }
    }

    function saveData() {
        try {
            localStorage.setItem("weasleys_jelly_items_v4", JSON.stringify(items));
            localStorage.setItem("weasleys_jelly_coupons_v4", userCoupons.toString());
            localStorage.setItem("weasleys_jelly_bag_v4", JSON.stringify(myBag));
        } catch (e) {}
    }

    function showToast(msg) {
        const toast = document.getElementById("toastMessage");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function checkAdmin() {
        if (isAdminAuth) return true;
        const pw = prompt("🔒 위즐리 상점 관리자 비밀번호 4자리를 입력하세요:");
        if (pw === ADMIN_PW) {
            isAdminAuth = true;
            showToast("🪄 관리자 인증이 완료되었습니다!");
            return true;
        } else {
            if (pw !== null) showToast("⚠️ 비밀번호가 올바르지 않습니다.");
            return false;
        }
    }

    // 🛍️ 아이템 렌더링 (카드 1/3을 꽉 채우는 미디어 쇼케이스)
    function render() {
        document.getElementById("userCoupons").innerText = userCoupons;
        document.getElementById("bagCount").innerText = myBag.length;

        const grid = document.getElementById("shopGrid");
        if (items.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#8c7866;">진열된 마법 장난감이 없습니다. 신상을 등록해 보세요!</div>';
            return;
        }

        let html = "";
        for (let i = 0; i < items.length; i++) {
            const it = items[i];
            let badgeClass = "badge-new";
            if (it.badge === "HOT") badgeClass = "badge-hot";
            else if (it.badge === "BEST") badgeClass = "badge-best";
            else if (it.badge === "RARE") badgeClass = "badge-rare";

            // 🖼️ 1/3 높이의 쇼케이스에 꽉 차는 이미지 또는 72px 이모지
            const showcaseContent = it.image
                ? `<img src="${it.image}" alt="${escapeHtml(it.name)}" class="showcase-img" />`
                : `<span class="showcase-emoji">${it.emoji || '🎁'}</span>`;

            html += `
          <div class="item-card">
            <span class="item-badge ${badgeClass}">${it.badge || 'HOT'}</span>
            
            <!-- 상단 1/3 시원한 일러스트/사진 공간 -->
            <div class="item-media-showcase">
              ${showcaseContent}
            </div>

            <div class="item-name">${escapeHtml(it.name)}</div>
            <div class="item-tag">✨ ${escapeHtml(it.tag || '신비한 효과')}</div>
            <div class="item-desc">${escapeHtml(it.desc)}</div>

            <div class="card-footer">
              <div class="price-tag">
                <span>🍺</span>
                <strong>${it.price}</strong>장
              </div>
              <button class="btn-buy" onclick="buyItem('${it.id}')">교환하기</button>
            </div>

            <div class="admin-card-ctrls">
              <button class="btn-card-ctrl" onclick="editItem('${it.id}')">✏️ 수정</button>
              <button class="btn-card-ctrl btn-card-del" onclick="deleteItem('${it.id}')">🗑️ 삭제</button>
            </div>
          </div>
        `;
        }
        grid.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 아이템 교환
    function buyItem(id) {
        const it = items.find(x => x.id === id);
        if (!it) return;

        if (userCoupons < it.price) {
            showToast(`⚠️ 버터쿠폰이 부족합니다! (필요: ${it.price}장 / 보유: ${userCoupons}장)`);
            return;
        }

        userCoupons -= it.price;
        const now = new Date();
        const timeStr = `${now.getMonth() + 1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        myBag.unshift({
            id: 'bag_' + Date.now(),
            name: it.name,
            emoji: it.emoji,
            image: it.image || "",
            price: it.price,
            time: timeStr
        });

        saveData();
        render();

        try {
            confetti({
                particleCount: 70,
                spread: 65,
                origin: { y: 0.65 },
                colors: ['#ff70a6', '#ffd670', '#70d6ff', '#e9ff70', '#ff9770', '#ffffff']
            });
        } catch (e) {}

        showToast(`🎉 '${it.name}'을(를) 가방에 챙겼습니다! (-🍺 ${it.price}장)`);
    }

    /* === 🖼️ 관리자 이미지 파일 처리 (선명하고 큰 해상도로 최적화 저장) === */
    function handleImageFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            alert("이미지 파일만 등록할 수 있습니다!");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                // 카드의 1/3을 채우기 위해 충분히 선명한 가로 500px 기준 리사이징
                const maxDim = 500;
                let w = img.width;
                let h = img.height;
                if (w > h && w > maxDim) {
                    h = Math.round((h * maxDim) / w);
                    w = maxDim;
                } else if (h > maxDim) {
                    w = Math.round((w * maxDim) / h);
                    h = maxDim;
                }

                const c = document.createElement("canvas");
                c.width = w;
                c.height = h;
                const cx = c.getContext("2d");
                cx.drawImage(img, 0, 0, w, h);

                const compressedData = c.toDataURL("image/webp", 0.88);
                document.getElementById("itemImageData").value = compressedData;
                document.getElementById("modalPreview").innerHTML = `<img src="${compressedData}" />`;
                document.getElementById("itemEmojiInput").value = "";
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    }

    function handleEmojiInput(e) {
        const val = e.target.value.trim();
        if (val) {
            document.getElementById("itemImageData").value = "";
            document.getElementById("itemImageFileInput").value = "";
            document.getElementById("modalPreview").innerHTML = val;
        }
    }

    function resetItemImage() {
        document.getElementById("itemImageData").value = "";
        document.getElementById("itemImageFileInput").value = "";
        document.getElementById("itemEmojiInput").value = "✨";
        document.getElementById("modalPreview").innerHTML = "✨";
    }

    /* === 관리자 모달 === */
    function openAdminModal() {
        if (!checkAdmin()) return;
        document.getElementById("adminModalTitle").innerText = "✨ 위즐리 신상 아이템 등록 (관리자)";
        document.getElementById("editItemId").value = "";
        resetItemImage();
        document.getElementById("itemBadgeInput").value = "NEW";
        document.getElementById("itemNameInput").value = "";
        document.getElementById("itemTagInput").value = "";
        document.getElementById("itemPriceInput").value = "2";
        document.getElementById("itemDescInput").value = "";
        document.getElementById("adminModal").style.display = "flex";
    }

    function closeAdminModal() {
        document.getElementById("adminModal").style.display = "none";
    }

    function editItem(id) {
        if (!checkAdmin()) return;
        const it = items.find(x => x.id === id);
        if (!it) return;

        document.getElementById("adminModalTitle").innerText = "✏️ 마법 아이템 정보 수정";
        document.getElementById("editItemId").value = it.id;
        document.getElementById("itemImageData").value = it.image || "";
        document.getElementById("itemImageFileInput").value = "";
        document.getElementById("itemEmojiInput").value = it.emoji || "";

        if (it.image) {
            document.getElementById("modalPreview").innerHTML = `<img src="${it.image}" />`;
        } else {
            document.getElementById("modalPreview").innerHTML = it.emoji || "✨";
        }

        document.getElementById("itemBadgeInput").value = it.badge || "HOT";
        document.getElementById("itemNameInput").value = it.name;
        document.getElementById("itemTagInput").value = it.tag || "";
        document.getElementById("itemPriceInput").value = it.price;
        document.getElementById("itemDescInput").value = it.desc;
        document.getElementById("adminModal").style.display = "flex";
    }

    function deleteItem(id) {
        if (!checkAdmin()) return;
        const it = items.find(x => x.id === id);
        if (!it) return;

        if (confirm(`'${it.name}' 아이템을 상점에서 완전히 철거할까요?`)) {
            items = items.filter(x => x.id !== id);
            saveData();
            render();
            showToast(`🗑️ '${it.name}' 아이템이 삭제되었습니다.`);
        }
    }

    function saveItemFromModal() {
        const editId = document.getElementById("editItemId").value;
        const imageData = document.getElementById("itemImageData").value;
        const emoji = document.getElementById("itemEmojiInput").value.trim() || (imageData ? "" : "✨");
        const badge = document.getElementById("itemBadgeInput").value;
        const name = document.getElementById("itemNameInput").value.trim();
        const tag = document.getElementById("itemTagInput").value.trim();
        const price = parseInt(document.getElementById("itemPriceInput").value, 10) || 1;
        const desc = document.getElementById("itemDescInput").value.trim();

        if (!name) {
            showToast("⚠️ 아이템 이름을 입력해 주세요!");
            return;
        }

        if (editId) {
            const it = items.find(x => x.id === editId);
            if (it) {
                it.image = imageData;
                it.emoji = emoji;
                it.badge = badge;
                it.name = name;
                it.tag = tag;
                it.price = price;
                it.desc = desc;
            }
            showToast("✨ 아이템 정보가 수정되었습니다!");
        } else {
            const newItem = {
                id: 'item_' + Date.now(),
                image: imageData,
                emoji, badge, name, tag, price, desc
            };
            items.unshift(newItem);
            showToast("🚀 신상 아이템이 상점에 진열되었습니다!");
        }

        saveData();
        render();
        closeAdminModal();
    }

    /* === 버터쿠폰 모달 === */
    function openCouponModal() {
        document.getElementById("couponAmountInput").value = userCoupons;
        document.getElementById("couponModal").style.display = "flex";
    }
    function closeCouponModal() {
        document.getElementById("couponModal").style.display = "none";
    }
    function quickAddCoupon(amt) {
        const inp = document.getElementById("couponAmountInput");
        inp.value = (parseInt(inp.value, 10) || 0) + amt;
    }
    function saveUserCoupons() {
        const val = parseInt(document.getElementById("couponAmountInput").value, 10);
        userCoupons = Math.max(0, isNaN(val) ? 0 : val);
        saveData();
        render();
        closeCouponModal();
        showToast(`🍺 버터쿠폰이 ${userCoupons}장으로 설정되었습니다.`);
    }

    /* === 내 마법 가방 모달 === */
    function openBagModal() {
        const list = document.getElementById("bagList");
        if (myBag.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding: 30px; color:#a8947f; font-size:13px;">아직 교환한 아이템이 없습니다. 버터쿠폰으로 교환해 보세요!</div>';
        } else {
            let html = "";
            for (let i = 0; i < myBag.length; i++) {
                const b = myBag[i];
                const iconHtml = b.image
                    ? `<img src="${b.image}" class="bag-thumb" />`
                    : `<span style="font-size:22px; margin-right:8px;">${b.emoji || '🎁'}</span>`;

                html += `
            <div class="bag-item">
              <div style="display:flex; align-items:center;">
                ${iconHtml}
                <div>
                  <strong>${escapeHtml(b.name)}</strong>
                  <div class="date">${b.time} 교환</div>
                </div>
              </div>
              <span class="used-cost">-🍺 ${b.price}장</span>
            </div>
          `;
            }
            list.innerHTML = html;
        }
        document.getElementById("bagModal").style.display = "flex";
    }
    function closeBagModal() {
        document.getElementById("bagModal").style.display = "none";
    }
    function clearBag() {
        if (myBag.length === 0) return;
        if (confirm("가방 안의 교환 기록을 모두 지우시겠습니까?")) {
            myBag = [];
            saveData();
            render();
            openBagModal();
            showToast("가방 기록이 초기화되었습니다.");
        }
    }

    window.onclick = function(e) {
        if (e.target.classList.contains('modal-overlay')) {
            e.target.style.display = "none";
        }
    };

    /* 캔버스 배경 애니메이션 */
    const canvas = document.getElementById("jellybeanCanvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    const JELLY_COLORS = [
        { fill: "#ff9bb2", highlight: "#ffe0e8" },
        { fill: "#ffd166", highlight: "#fff3cc" },
        { fill: "#06d6a0", highlight: "#b9f5e1" },
        { fill: "#118ab2", highlight: "#99dcf2" },
        { fill: "#c77dff", highlight: "#eed3ff" },
        { fill: "#ff9e00", highlight: "#ffe4b3" }
    ];

    const beans = [];
    const BEAN_COUNT = 24;

    for (let i = 0; i < BEAN_COUNT; i++) {
        beans.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 10 + 16,
            color: JELLY_COLORS[Math.floor(Math.random() * JELLY_COLORS.length)],
            vx: (Math.random() - 0.5) * 0.4,
            vy: -Math.random() * 0.45 - 0.15,
            angle: Math.random() * Math.PI * 2,
            vAngle: (Math.random() - 0.5) * 0.015,
            alpha: Math.random() * 0.4 + 0.4
        });
    }

    const sparkles = [];
    const SPARKLE_COUNT = 35;
    for (let i = 0; i < SPARKLE_COUNT; i++) {
        sparkles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2 + 1,
            alpha: Math.random(),
            speed: Math.random() * 0.02 + 0.01
        });
    }

    function drawJellybean(x, y, size, angle, color, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.globalAlpha = alpha;

        ctx.beginPath();
        const w = size * 1.5;
        const h = size * 0.9;
        ctx.moveTo(-w * 0.5, 0);
        ctx.bezierCurveTo(-w * 0.5, -h * 0.9, w * 0.4, -h * 0.8, w * 0.5, 0);
        ctx.bezierCurveTo(w * 0.6, h * 0.8, -w * 0.2, h * 0.9, -w * 0.5, 0);

        ctx.shadowColor = color.fill;
        ctx.shadowBlur = 10;
        ctx.fillStyle = color.fill;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.ellipse(-w * 0.15, -h * 0.35, w * 0.25, h * 0.16, -0.2, 0, Math.PI * 2);
        ctx.fillStyle = color.highlight;
        ctx.globalAlpha = alpha * 0.85;
        ctx.fill();

        ctx.restore();
    }

    function animateBackground() {
        ctx.clearRect(0, 0, width, height);

        for (let s of sparkles) {
            s.alpha += s.speed;
            const currentAlpha = (Math.sin(s.alpha) + 1) / 2 * 0.6 + 0.2;
            ctx.save();
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#fbbf24";
            ctx.shadowColor = "#fde047";
            ctx.shadowBlur = 8;
            ctx.globalAlpha = currentAlpha;
            ctx.fill();
            ctx.restore();

            s.y -= 0.2;
            if (s.y < -10) s.y = height + 10;
        }

        for (let b of beans) {
            b.x += b.vx;
            b.y += b.vy;
            b.angle += b.vAngle;

            if (b.y < -50) {
                b.y = height + 50;
                b.x = Math.random() * width;
            }
            if (b.x < -50) b.x = width + 50;
            if (b.x > width + 50) b.x = -50;

            drawJellybean(b.x, b.y, b.size, b.angle, b.color, b.alpha);
        }

        requestAnimationFrame(animateBackground);
    }

    loadData();
    render();
    animateBackground();
</script>
</body>
</html>
