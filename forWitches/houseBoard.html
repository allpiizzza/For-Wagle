<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>호그와트 기숙사 출석부 & 버터맥주 보관소</title>
    <style>
        :root {
            --bg: #090a12;
            --card-bg: rgba(18, 22, 38, 0.88);
            --card-inner: #0c0f1d;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2a3352;

            --gold: #f59e0b;
            --gold-light: #fbbf24;
            --gold-glow: rgba(245, 158, 11, 0.35);

            --butter-beer: #f59e0b;
            --butter-glow: rgba(245, 158, 11, 0.5);

            --gryf-color: #f87171;
            --slyth-color: #34d399;
            --raven-color: #60a5fa;
            --huff-color: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                    radial-gradient(ellipse at 20% 15%, rgba(67, 24, 99, 0.35) 0%, transparent 45%),
                    radial-gradient(ellipse at 80% 20%, rgba(20, 45, 95, 0.35) 0%, transparent 45%),
                    radial-gradient(circle at 50% 80%, rgba(30, 27, 75, 0.3) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text);
            padding: 28px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 27px;
            font-weight: 800;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 0 16px var(--gold-glow), 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 13px;
            color: #cbd5e1;
            margin-top: 6px;
        }

        /* 컨트롤 바 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 22px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
        }

        .target-info {
            font-size: 13px;
            color: #cbd5e1;
        }
        .target-info strong {
            color: var(--gold-light);
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 13px;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background: #1b2138;
            color: var(--gold-light);
            border: 1px solid #3d4a75;
        }
        .btn-secondary:hover {
            background: #252e4d;
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .btn-reset {
            background: #2b1419;
            color: #fca5a5;
            border: 1px solid #63222a;
        }
        .btn-reset:hover {
            background: #3b1921;
            border-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }

        /* 4대 기숙사 카드 그리드 (2x2) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
            margin-bottom: 26px;
        }

        .house-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }

        .house-card.gryffindor { border-top: 4px solid var(--gryf-color); }
        .house-card.slytherin { border-top: 4px solid var(--slyth-color); }
        .house-card.ravenclaw { border-top: 4px solid var(--raven-color); }
        .house-card.hufflepuff { border-top: 4px solid var(--huff-color); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .house-title {
            font-size: 21px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gryffindor .house-title { color: #fca5a5; text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .slytherin .house-title { color: #6ee7b7; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
        .ravenclaw .house-title { color: #93c5fd; text-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .hufflepuff .house-title { color: #fde047; text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

        .top-badges {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gem-badge {
            font-size: 14px;
            letter-spacing: 2px;
            background: var(--card-inner);
            padding: 5px 10px;
            border-radius: 12px;
            border: 1px solid #333d61;
        }

        .butter-badge {
            background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
            border: 1px solid #f59e0b;
            color: #fef3c7;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
            cursor: pointer;
        }
        .butter-badge:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 14px var(--butter-glow);
        }

        /* 모래시계 게이지 바 */
        .bar-container {
            background: #090b14;
            border-radius: 20px;
            height: 25px;
            overflow: hidden;
            position: relative;
            border: 1px solid #2a3554;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.7);
        }

        .bar-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.45s ease;
        }

        .gryffindor .bar-fill { background: linear-gradient(90deg, #7f1d1d 0%, #dc2626 50%, #f87171 100%); }
        .slytherin .bar-fill { background: linear-gradient(90deg, #064e3b 0%, #059669 50%, #34d399 100%); }
        .ravenclaw .bar-fill { background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #60a5fa 100%); }
        .hufflepuff .bar-fill { background: linear-gradient(90deg, #78350f 0%, #d97706 50%, #fbbf24 100%); }

        .bar-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.95);
            pointer-events: none;
        }

        .stats-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
        }

        .chip {
            background: rgba(10, 13, 24, 0.8);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 4px 9px;
            color: var(--text-muted);
        }
        .chip strong { color: #fff; }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-action-main {
            background: linear-gradient(180deg, #1f2742 0%, #161c31 100%);
            border: 1px solid #3c4873;
            color: #f1f5f9;
            font-size: 12px;
            font-weight: 700;
            padding: 9px 4px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }
        .btn-action-main:hover {
            border-color: var(--gold);
            color: var(--gold-light);
            box-shadow: 0 0 10px var(--gold-glow);
            transform: translateY(-1px);
        }

        .btn-act-wide {
            grid-column: span 2;
            background: rgba(13, 16, 29, 0.6);
            border: 1px dashed #3a466c;
            color: var(--text-muted);
            font-size: 12px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-act-wide:hover {
            color: #fff;
            border-color: var(--gold);
            box-shadow: 0 0 8px var(--gold-glow);
        }

        .btn-undo {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 11px;
            text-align: right;
            padding: 2px 4px;
            cursor: pointer;
        }
        .btn-undo:hover { color: #f87171; text-decoration: underline; }

        /* 장부 로그 */
        .log-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .log-header h2 {
            font-size: 17px;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .log-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-item {
            background: rgba(9, 11, 20, 0.9);
            border: 1px solid #28314f;
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .log-tags {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .log-house-tag {
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 11px;
        }
        .log-item.gryffindor .log-house-tag { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
        .log-item.slytherin .log-house-tag { background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
        .log-item.ravenclaw .log-house-tag { background: #172554; color: #93c5fd; border: 1px solid #1e3a8a; }
        .log-item.hufflepuff .log-house-tag { background: #422006; color: #fde047; border: 1px solid #78350f; }

        .log-type-tag {
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 11px;
            background: #1b2138;
            color: var(--gold-light);
            border: 1px solid #3d4a75;
        }
        .log-type-tag.beer {
            background: #451a03;
            color: #fde047;
            border-color: #f59e0b;
        }

        .log-members { color: #f1f5f9; font-weight: 600; margin-left: 4px; }
        .log-time { color: var(--text-muted); font-size: 11px; white-space: nowrap; }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 12, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 16px;
            backdrop-filter: blur(6px);
        }

        .modal {
            background: linear-gradient(180deg, #1b2138 0%, #101426 100%);
            border: 1px solid var(--gold);
            border-radius: 18px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 25px var(--gold-glow);
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            font-size: 17px;
            color: var(--gold-light);
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .modal-body { padding: 18px 20px; }
        .modal-desc {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 14px;
        }

        .student-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .student-btn {
            background: #090c17;
            border: 1px solid #2e3858;
            border-radius: 9px;
            padding: 10px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .student-btn.active {
            background: #2a2010;
            border-color: var(--gold);
            color: var(--gold-light);
            font-weight: 700;
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c0f1c;
        }

        .btn-submit-modal {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 12px var(--gold-glow);
        }
        .btn-submit-modal:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.6);
        }

        .beer-checkbox-area {
            margin-top: 14px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed var(--gold);
            border-radius: 8px;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--gold-light);
            cursor: pointer;
        }
        .beer-checkbox-area input {
            accent-color: var(--gold);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏰 호그와트 기숙사 출석부 🪄</h1>
        <p>프리덤 자습 & 정규 마법수업 & 🍺 버터맥주 쿠폰 보관소</p>
    </header>

    <div class="controls">
        <div class="target-info">
            ✨ 모래시계 보석 5단계 완충 & <strong>🍺 버터맥주 쿠폰 관리</strong>
        </div>
        <div class="btn-group">
            <button class="btn-secondary" onclick="exportData()">💾 장부 복사</button>
            <button class="btn-reset" onclick="resetAllData()">🔄 전체 초기화</button>
        </div>
    </div>

    <!-- 4대 기숙사 카드 -->
    <div class="grid" id="houseGrid"></div>

    <!-- 실시간 히스토리 장부 -->
    <div class="log-section">
        <div class="log-header">
            <h2>📜 프리덤 / 정규수업 / 🍺 버터맥주 히스토리</h2>
            <span style="font-size: 12px; color: var(--text-muted);">실시간 활동 내역</span>
        </div>
        <div class="log-list" id="logList"></div>
    </div>
</div>

<!-- 🍺 버터맥주 쿠폰 관리 모달 (관리자 전용) -->
<div class="modal-overlay" id="beerModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="beerModalTitle">🍺 버터맥주 쿠폰 관리 (관리자)</h3>
            <button style="background:transparent; color:#fff; font-size:16px;" onclick="closeBeerModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="modal-desc" id="beerModalDesc">현재 소지 잔수를 조정하거나 사유를 남겨주세요:</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
                <button class="btn-secondary" style="padding:12px; font-size:13px;" onclick="adjustBeer(1)">🍺 +1장 지급 (미션달성)</button>
                <button class="btn-secondary" style="padding:12px; font-size:13px;" onclick="adjustBeer(-1)">🍺 -1장 사용 (휴식/교환)</button>
            </div>
            <div style="display:flex; gap:6px;">
                <input type="text" id="beerReasonInput" placeholder="사유 입력 (예: 5월 게릴라 퀴즈 1등 보상)" style="flex:1; padding:9px 12px; background:#090c17; border:1px solid var(--border); border-radius:8px; color:#fff; outline:none;" />
            </div>
        </div>
    </div>
</div>

<!-- 출석 체크 모달 (프리덤 / 정규수업) -->
<div class="modal-overlay" id="attendanceModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">참여자 체크</h3>
            <button style="background:transparent; color:#fff; font-size:16px;" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="modal-desc" id="modalDesc"></div>
            <div class="student-grid" id="modalStudentGrid"></div>

            <label class="beer-checkbox-area" id="freedomBeerOption" style="display:none;">
                <input type="checkbox" id="grantBeerCheckbox" checked />
                <span>🍺 프리덤 완료 보너스로 <strong>버터맥주 쿠폰 +1장</strong> 함께 적립</span>
            </label>
        </div>
        <div class="modal-footer">
            <div id="modalSelectedCount" style="font-size: 13px; font-weight: 700; color: var(--gold);">선택: 0명</div>
            <div style="display: flex; gap: 8px;">
                <button class="btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn-submit-modal" onclick="submitAttendance()">✨ 출석 완료 기입</button>
            </div>
        </div>
    </div>
</div>

<script>
    var ADMIN_PW = "0628";

    var HOUSE_STUDENTS = {
        gryffindor: [
            { grade: 1, name: "최미노" }, { grade: 2, name: "밍보" }, { grade: 3, name: "유재" },
            { grade: 4, name: "고래" }, { grade: 5, name: "구마" }, { grade: 6, name: "난수" }, { grade: 7, name: "당근" }
        ],
        slytherin: [
            { grade: 1, name: "동글" }, { grade: 2, name: "따란" }, { grade: 3, name: "모모" },
            { grade: 4, name: "모아나" }, { grade: 5, name: "새벽" }, { grade: 6, name: "송" }, { grade: 7, name: "수리" }
        ],
        ravenclaw: [
            { grade: 1, name: "스물" }, { grade: 2, name: "신디" }, { grade: 3, name: "써니" },
            { grade: 4, name: "에스" }, { grade: 5, name: "영원" }, { grade: 6, name: "유누" }, { grade: 7, name: "윤슬" }
        ],
        hufflepuff: [
            { grade: 1, name: "이리" }, { grade: 2, name: "임유월" }, { grade: 3, name: "제임스" },
            { grade: 4, name: "주니" }, { grade: 5, name: "채채" }, { grade: 6, name: "초록" }, { grade: 7, name: "최리" }
        ]
    };

    var HOUSES = [
        { id: "gryffindor", name: "그리핀도르", icon: "🦁", gemFilled: "🔴", gemEmpty: "⚪", gemName: "루비" },
        { id: "slytherin", name: "슬리데린", icon: "🐍", gemFilled: "🟢", gemEmpty: "⚪", gemName: "에메랄드" },
        { id: "ravenclaw", name: "래번클로", icon: "🦅", gemFilled: "🔵", gemEmpty: "⚪", gemName: "사파이어" },
        { id: "hufflepuff", name: "후플푸프", icon: "🦡", gemFilled: "🟡", gemEmpty: "⚪", gemName: "토파즈" }
    ];

    var MAX_SCORE = 50;
    var state = {};
    var beers = {};
    var logs = [];

    var currentHouse = null;
    var currentType = null;
    var selectedStudents = [];

    function checkAdminAuth() {
        var pw = prompt("🔒 관리자 비밀번호 4자리를 입력하세요:");
        if (pw === ADMIN_PW) {
            return true;
        } else {
            if (pw !== null) alert("⚠️ 비밀번호가 올바르지 않습니다.");
            return false;
        }
    }

    function loadData() {
        try {
            var saved = localStorage.getItem("hogwarts_wagle_pure_v1");
            if (saved) {
                var parsed = JSON.parse(saved);
                state = parsed.state || {};
                beers = parsed.beers || {};
                logs = parsed.logs || [];
            } else {
                initDefault();
            }
        } catch (e) {
            initDefault();
        }
    }

    function initDefault() {
        state = {};
        beers = {};
        for (var i = 0; i < HOUSES.length; i++) {
            var hid = HOUSES[i].id;
            state[hid] = { freedom: 0, lesson: 0, bonus: 0 };
            beers[hid] = 0;
        }
        logs = [];
        saveData();
    }

    function saveData() {
        try {
            localStorage.setItem("hogwarts_wagle_pure_v1", JSON.stringify({
                state: state,
                beers: beers,
                logs: logs
            }));
        } catch (e) {}
    }

    function calcInternalScore(d) {
        return (d.freedom * 5) + (d.lesson * 10) + (d.bonus * 3);
    }

    function buildGemIcons(score, filledIcon, emptyIcon) {
        var count = Math.min(5, Math.floor(score / 10));
        var str = "";
        for (var i = 0; i < 5; i++) str += (i < count) ? filledIcon : emptyIcon;
        return str;
    }

    function getBarMessage(pct, gemName) {
        if (pct === 0) return "모래시계에 첫 " + gemName + "를 채워보세요! ✨";
        if (pct < 30) return gemName + " 보석 적립 중... 🪄";
        if (pct < 70) return gemName + " 모래시계가 차오르는 중! 🌟";
        if (pct < 100) return "완충 직전! 눈부신 " + gemName + " 빛 ✨";
        return "🎉 모래시계 " + gemName + " 완충 완료! 🎉";
    }

    function render() {
        renderHouses();
        renderLogs();
    }

    function renderHouses() {
        var grid = document.getElementById("houseGrid");
        var html = "";

        for (var i = 0; i < HOUSES.length; i++) {
            var h = HOUSES[i];
            var d = state[h.id] || { freedom: 0, lesson: 0, bonus: 0 };
            var beerCount = beers[h.id] || 0;
            var score = calcInternalScore(d);
            var pct = Math.min(100, Math.round((score / MAX_SCORE) * 100));

            var gemString = buildGemIcons(score, h.gemFilled, h.gemEmpty);
            var barMsg = getBarMessage(pct, h.gemName);

            html += '<div class="house-card ' + h.id + '">' +
                '<div class="card-top">' +
                '<div class="house-title">' + h.icon + ' ' + h.name + '</div>' +
                '<div class="top-badges">' +
                '<button class="butter-badge" onclick="openBeerModal(\'' + h.id + '\')" title="클릭하여 버터맥주 관리 (관리자)">🍺 쿠폰 <strong>' + beerCount + '</strong>잔</button>' +
                '<div class="gem-badge">' + gemString + '</div>' +
                '</div>' +
                '</div>' +
                '<div class="bar-container">' +
                '<div class="bar-fill" style="width:' + pct + '%;"></div>' +
                '<div class="bar-text">' + barMsg + '</div>' +
                '</div>' +

                '<div class="stats-chips">' +
                '<span class="chip">📖 프리덤 <strong>' + d.freedom + '</strong>회</span>' +
                '<span class="chip">🪄 정규수업 <strong>' + d.lesson + '</strong>회</span>' +
                '<span class="chip">🍺 버터맥주 <strong>' + beerCount + '</strong>잔</span>' +
                '<span class="chip">⚡ 보너스 <strong>' + d.bonus + '</strong>회</span>' +
                '</div>' +
                '<div class="action-buttons">' +
                '<button class="btn-action-main" onclick="openModal(\'' + h.id + '\', \'freedom\')">📖 프리덤 (2인이상)</button>' +
                '<button class="btn-action-main" onclick="openModal(\'' + h.id + '\', \'lesson\')">🪄 정규수업 출석</button>' +
                '<button class="btn-act-wide" onclick="addBonus(\'' + h.id + '\')">+ 퀴즈/스니치 보너스</button>' +
                '</div>' +
                '<button class="btn-undo" onclick="undo(\'' + h.id + '\')">↩️ 마지막 입력 취소 (-1회)</button>' +
                '</div>';
        }

        grid.innerHTML = html;
    }

    function renderLogs() {
        var logContainer = document.getElementById("logList");
        if (logs.length === 0) {
            logContainer.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; padding:16px;">아직 기록된 내역이 없습니다.</div>';
            return;
        }

        var html = "";
        for (var i = 0; i < logs.length; i++) {
            var item = logs[i];
            var typeText = "";
            var isBeer = false;
            if (item.type === 'freedom') typeText = '📖 프리덤';
            else if (item.type === 'lesson') typeText = '🪄 정규수업';
            else if (item.type === 'beer_get') { typeText = '🍺 버터맥주 획득'; isBeer = true; }
            else if (item.type === 'beer_use') { typeText = '🍻 버터맥주 사용'; isBeer = true; }

            html += '<div class="log-item ' + item.houseId + '">' +
                '<div style="display:flex; align-items:center; flex-wrap:wrap; gap:4px;">' +
                '<div class="log-tags">' +
                '<span class="log-house-tag">' + item.houseName + '</span>' +
                '<span class="log-type-tag' + (isBeer ? ' beer' : '') + '">' + typeText + '</span>' +
                '</div>' +
                '<span class="log-members">' + item.detail + '</span>' +
                '</div>' +
                '<span class="log-time">' + item.time + '</span>' +
                '</div>';
        }
        logContainer.innerHTML = html;
    }

    /* === 🍺 버터맥주 관리 === */
    function openBeerModal(houseId) {
        if (!checkAdminAuth()) return;
        currentHouse = houseId;
        var hName = getHouseName(houseId);
        var currentBeer = beers[houseId] || 0;
        document.getElementById("beerModalTitle").innerText = "🍺 [" + hName + "] 버터맥주 쿠폰 관리";
        document.getElementById("beerModalDesc").innerText = "현재 소지: " + currentBeer + "잔 | 획득 또는 사용 처리할 사유를 선택하세요:";
        document.getElementById("beerReasonInput").value = "";
        document.getElementById("beerModal").style.display = "flex";
    }

    function closeBeerModal() {
        document.getElementById("beerModal").style.display = "none";
    }

    function adjustBeer(amount) {
        if (!beers[currentHouse]) beers[currentHouse] = 0;
        if (amount < 0 && beers[currentHouse] <= 0) {
            alert("보유 중인 버터맥주 쿠폰이 없습니다!");
            return;
        }

        var reason = document.getElementById("beerReasonInput").value.trim();
        if (!reason) {
            reason = amount > 0 ? "특별 미션 달성 보너스" : "아이템 교환 또는 휴식 사용";
        }

        beers[currentHouse] += amount;
        var logType = amount > 0 ? 'beer_get' : 'beer_use';
        var sign = amount > 0 ? "+1잔 (" + reason + ")" : "-1잔 (" + reason + ")";
        addLog(currentHouse, logType, "버터맥주 " + sign);

        saveData();
        render();
        closeBeerModal();
        alert("✨ [" + getHouseName(currentHouse) + "] 버터맥주 쿠폰 " + (amount > 0 ? "1장 지급" : "1장 사용") + " 처리 완료!");
    }

    /* === 출석 체크 모달 (프리덤 / 정규수업) === */
    function openModal(houseId, type) {
        currentHouse = houseId;
        currentType = type;
        selectedStudents = [];

        var hName = getHouseName(houseId);
        var modalTitle = document.getElementById("modalTitle");
        var modalDesc = document.getElementById("modalDesc");
        var beerOption = document.getElementById("freedomBeerOption");

        if (type === 'freedom') {
            modalTitle.innerText = "📖 [" + hName + "] 프리덤 자습 참여자 체크";
            modalDesc.innerHTML = "⚠️ <strong>최소 2명 이상</strong> 선택해야 프리덤 1회가 유효합니다.";
            beerOption.style.display = "flex";
        } else {
            modalTitle.innerText = "🪄 [" + hName + "] 정규 마법수업 완주자 체크";
            modalDesc.innerHTML = "💡 오늘 정규 토론에 참여한 학생들을 모두 체크해 주세요.";
            beerOption.style.display = "none";
        }

        var grid = document.getElementById("modalStudentGrid");
        var students = HOUSE_STUDENTS[houseId] || [];
        var html = "";

        for (var j = 0; j < students.length; j++) {
            var s = students[j];
            var label = s.grade + "학년 " + s.name;
            html += '<button type="button" class="student-btn" id="mbtn_' + j + '" onclick="toggleStudent(' + j + ', \'' + label + '\')">' +
                '<span>🔘</span> <span>' + label + '</span>' +
                '</button>';
        }

        grid.innerHTML = html;
        updateCount();
        document.getElementById("attendanceModal").style.display = "flex";
    }

    function toggleStudent(index, label) {
        var btn = document.getElementById("mbtn_" + index);
        var idx = selectedStudents.indexOf(label);
        if (idx === -1) {
            selectedStudents.push(label);
            btn.classList.add("active");
            btn.querySelector("span").innerText = "🟢";
        } else {
            selectedStudents.splice(idx, 1);
            btn.classList.remove("active");
            btn.querySelector("span").innerText = "🔘";
        }
        updateCount();
    }

    function updateCount() {
        document.getElementById("modalSelectedCount").innerText = "선택: " + selectedStudents.length + "명";
    }

    function closeModal() {
        document.getElementById("attendanceModal").style.display = "none";
    }

    function submitAttendance() {
        if (currentType === 'freedom' && selectedStudents.length < 2) {
            alert("⚠️ 프리덤은 최소 2명 이상 함께 자습했을 때만 인정됩니다!");
            return;
        }
        if (selectedStudents.length === 0) {
            alert("⚠️ 최소 1명 이상 선택해 주세요!");
            return;
        }

        var alertMsg = "";
        if (currentType === 'freedom') {
            state[currentHouse].freedom++;
            var detail = "참여: " + selectedStudents.join(', ');

            var grantBeer = document.getElementById("grantBeerCheckbox").checked;
            if (grantBeer) {
                if (!beers[currentHouse]) beers[currentHouse] = 0;
                beers[currentHouse]++;
                detail += " (🍺 버터맥주 +1장 적립)";
                addLog(currentHouse, 'beer_get', '프리덤 완주 보너스로 버터맥주 1장 적립');
            }

            addLog(currentHouse, currentType, detail);
            alertMsg = "✨ [" + getHouseName(currentHouse) + "] 프리덤 완료!\n참여자: " + selectedStudents.join(", ") + (grantBeer ? "\n🍺 버터맥주 쿠폰 1장이 적립되었습니다!" : "");
        } else {
            state[currentHouse].lesson++;
            addLog(currentHouse, currentType, "참여: " + selectedStudents.join(', '));
            alertMsg = "✨ [" + getHouseName(currentHouse) + "] 정규수업 완료!\n참여자: " + selectedStudents.join(", ");
        }

        saveData();
        render();
        closeModal();
        alert(alertMsg);
    }

    function addBonus(houseId) {
        if (!state[houseId]) return;
        state[houseId].bonus++;
        addLog(houseId, 'lesson', '보너스 포인트 적립');
        saveData();
        render();
    }

    function addLog(houseId, type, detail) {
        var now = new Date();
        var timeStr = (now.getMonth() + 1) + "월 " + now.getDate() + "일 " +
            String(now.getHours()).padStart(2, '0') + ":" +
            String(now.getMinutes()).padStart(2, '0');

        logs.unshift({
            houseId: houseId,
            houseName: getHouseName(houseId),
            type: type,
            detail: detail,
            time: timeStr
        });
        if (logs.length > 70) logs.pop();
    }

    function getHouseName(houseId) {
        for (var i = 0; i < HOUSES.length; i++) {
            if (HOUSES[i].id === houseId) return HOUSES[i].name;
        }
        return "";
    }

    function undo(houseId) {
        if (!state[houseId]) return;
        var choice = prompt("취소할 항목 번호를 입력하세요:\n1: 프리덤 취소\n2: 정규수업 취소\n3: 버터맥주 1잔 차감\n4: 보너스 취소", "1");
        var targetType = "";
        if (choice === "1" && state[houseId].freedom > 0) {
            state[houseId].freedom--;
            targetType = "freedom";
        } else if (choice === "2" && state[houseId].lesson > 0) {
            state[houseId].lesson--;
            targetType = "lesson";
        } else if (choice === "3" && beers[houseId] > 0) {
            beers[houseId]--;
            targetType = "beer_get";
        } else if (choice === "4" && state[houseId].bonus > 0) {
            state[houseId].bonus--;
        }

        if (targetType) {
            for (var i = 0; i < logs.length; i++) {
                if (logs[i].houseId === houseId && logs[i].type === targetType) {
                    logs.splice(i, 1);
                    break;
                }
            }
        }
        saveData();
        render();
    }

    function exportData() {
        var data = { state: state, beers: beers, logs: logs };
        var text = JSON.stringify(data, null, 2);
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() {
                alert("호그와트 출석 & 버터맥주 장부 데이터가 복사되었습니다!");
            });
        } else {
            prompt("복사하세요:", text);
        }
    }

    function resetAllData() {
        if (checkAdminAuth()) {
            if (confirm("모든 기숙사 점수, 버터맥주 쿠폰, 출석 히스토리를 0으로 리셋할까요?")) {
                try { localStorage.removeItem("hogwarts_wagle_pure_v1"); } catch(e) {}
                initDefault();
                render();
                alert("초기화되었습니다!");
            }
        }
    }

    loadData();
    render();
</script>
</body>
</html>
